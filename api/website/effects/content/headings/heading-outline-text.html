<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-hout{width:min(1040px,100%);display:grid;gap:.6em}
.fx-hout .eye{font-size:.78em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.fx-hout .w{display:block;width:fit-content;max-width:100%;font:700 clamp(3em,15vw,9.5em)/1 var(--font-heading);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.6px var(--text);background:linear-gradient(var(--primary),var(--primary)) 0 0/0% 100% no-repeat;-webkit-background-clip:text;background-clip:text;transition:background-size calc(.7s/var(--speed)) cubic-bezier(.7,0,.2,1);cursor:default;padding-bottom:.04em}
.fx-hout .w:hover{background-size:100% 100%}
.fx-hout .w.f{-webkit-text-stroke-color:var(--accent);background-image:linear-gradient(var(--accent),var(--accent));background-size:100% 100%}
.fx-hout .w.f:hover{background-size:0% 100%}
.fx-hout p{max-width:40ch;opacity:.7;margin-top:1em;font-size:1.05em}
@media(prefers-reduced-motion:reduce){.fx-hout .w{transition:none}}
/* touch: :hover mirrored as .is-tap */
.fx-hout .w.is-tap{background-size:100% 100%}
.fx-hout .w.f.is-tap{background-size:0% 100%}

</style>

<div class="fx fx-hout"><span class="eye">What we do</span><span class="w" role="presentation">Design</span><span class="w f" role="presentation">Build</span><span class="w" role="presentation">Launch</span><p>Stroked type keeps a headline airy; the fill arrives only when you ask for it.</p></div>

<script>
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
