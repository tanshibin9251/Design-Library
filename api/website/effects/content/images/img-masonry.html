<!-- Masonry — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-ms{width:min(1060px,100%);display:grid;gap:1.6em}
.fx-ms h2{font-size:clamp(1.8em,4vw,2.6em)}
.fx-ms .cols{column-count:3;column-gap:1.1em}
.fx-ms figure{margin:0 0 1.1em;break-inside:avoid;position:relative;border-radius:var(--radius);overflow:hidden;transition:transform calc(.4s/var(--speed)) ease,box-shadow calc(.4s/var(--speed)) ease}
.fx-ms .fx-art{aspect-ratio:var(--r)}
.fx-ms figcaption{position:absolute;left:.7em;bottom:.7em;padding:.35em .8em;border-radius:99px;font-size:.78em;font-weight:700;background:var(--surface);color:var(--text);opacity:0;transform:translateY(6px);transition:opacity calc(.3s/var(--speed)),transform calc(.3s/var(--speed))}
.fx-ms figure:hover{transform:translateY(-4px);box-shadow:0 22px 34px -22px color-mix(in srgb,var(--text) 60%,transparent)}
.fx-ms figure:hover figcaption{opacity:1;transform:none}
@media(max-width:820px){.fx-ms .cols{column-count:2}}
@media(max-width:420px){.fx-ms .cols{column-gap:.7em}.fx-ms figure{margin-bottom:.7em}}
@media(prefers-reduced-motion:reduce){.fx-ms figure,.fx-ms figcaption{transition:none}.fx-ms figure:hover{transform:none}
.fx-ms figure.is-tap{transform:none}}
/* touch: :hover mirrored as .is-tap */
.fx-ms figure.is-tap{transform:translateY(-4px);box-shadow:0 22px 34px -22px color-mix(in srgb,var(--text) 60%,transparent)}
.fx-ms figure.is-tap figcaption{opacity:1;transform:none}

</style>

<div class="fx fx-ms"><h2>The archive</h2><div class="cols"><figure style="--r:3/4"><div class="fx-art "></div><figcaption>Salt flats</figcaption></figure><figure style="--r:1/1"><div class="fx-art a2"></div><figcaption>Ink wash</figcaption></figure><figure style="--r:4/5"><div class="fx-art a3"></div><figcaption>Linen</figcaption></figure><figure style="--r:5/4"><div class="fx-art "></div><figcaption>Stairwell</figcaption></figure><figure style="--r:3/5"><div class="fx-art a2"></div><figcaption>Morning market</figcaption></figure><figure style="--r:1/1"><div class="fx-art a3"></div><figcaption>Terrace</figcaption></figure><figure style="--r:4/3"><div class="fx-art "></div><figcaption>Studio table</figcaption></figure><figure style="--r:3/4"><div class="fx-art a3"></div><figcaption>Greenhouse</figcaption></figure><figure style="--r:1/1"><div class="fx-art a2"></div><figcaption>Quiet street</figcaption></figure></div></div>

<script>
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
