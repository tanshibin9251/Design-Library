<style>
/* Peak Performance — tokens only */
.pk-head{position:fixed;inset:14px 14px auto;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 18px 12px 24px;border:1px solid var(--c-border);border-radius:18px;background:color-mix(in srgb,var(--c-surface) 72%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);max-width:calc(var(--w) - 28px);margin:auto}
.pk-logo{font:700 18px var(--f-head);letter-spacing:.2em;text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:10px}

.pk-head ul{display:flex;gap:28px;list-style:none;font:500 13px var(--f-body);letter-spacing:.04em}
.pk-head ul a{text-decoration:none;opacity:.78}.pk-head ul a:hover{opacity:1;color:var(--c-accent)}
.pk-head .more{position:relative}
.pk-btn{display:inline-flex;align-items:center;gap:10px;background:var(--c-accent);color:var(--on-accent);border:0;border-radius:99px;padding:.85em 1.6em;font:600 14px var(--f-body);text-decoration:none;letter-spacing:.02em}
.pk-btn.g{background:none;color:var(--c-text);box-shadow:inset 0 0 0 1px var(--c-border)}
.pk-btn:hover{filter:brightness(1.12)}
body{padding-top:0}
.pk-hero{min-height:100vh;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;padding:140px 20px 80px}
.pk-hero::before{content:"";position:absolute;width:min(900px,90vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 200deg,var(--c-accent),transparent 30%,var(--c-secondary) 55%,transparent 80%,var(--c-accent));filter:blur(90px);opacity:.28;z-index:0;animation:pk-spin 22s linear infinite}
@keyframes pk-spin{to{rotate:360deg}}
.pk-hero .in{position:relative;z-index:2;max-width:980px}
.pk-hero small{font:500 12px var(--f-body);letter-spacing:.34em;text-transform:uppercase;color:var(--c-secondary)}

.pk-device .ring{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(var(--c-accent) calc(var(--v)*1%),var(--c-border) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px))}

.pk-tile small{font:500 11px var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--c-accent)}
.pk-tile .ph{position:absolute;inset:0;border-radius:0;opacity:.35}
.pk-tile>*{position:relative}

.pk-prods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pk-p{border:1px solid var(--c-border);border-radius:24px;padding:20px;text-decoration:none;display:grid;gap:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c-primary) 94%,var(--c-text)),var(--c-surface));transition:border-color .25s,translate .25s}

.pk-p .sp b{color:var(--c-text);display:block;font-size:16px}
.pk-p .pr{display:flex;justify-content:space-between;align-items:center;font:600 18px var(--f-body)}
.pk-tabs{display:flex;gap:6px;border-bottom:1px solid var(--c-border);margin-bottom:24px}
.pk-tabs button{background:none;border:0;color:var(--c-secondary);padding:.9em 1.2em;font:600 14px var(--f-body);cursor:pointer;border-bottom:2px solid transparent}
.pk-tabs button[aria-selected=true]{color:var(--c-text);border-color:var(--c-accent)}
.pk-spec{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;font:500 15px var(--f-body)}
.pk-spec div{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--c-border)}.pk-spec span{color:var(--c-secondary)}
.pk-sec{padding:var(--pad) 0}
.pk-title{font-weight:700;font-size:clamp(30px,4.6vw,var(--h2));letter-spacing:-.04em;line-height:1.05;max-width:20ch;margin-bottom:34px}
.pk-title small{display:block;font:500 12px var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--c-accent);margin-bottom:12px}
.pk-pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:center;padding-top:130px}
@media(max-width:900px){.pk-head ul{display:none}.pk-kpis{grid-template-columns:1fr 1fr}.pk-bento,.pk-prods{grid-template-columns:1fr}.pk-tile.s2,.pk-tile.s3,.pk-tile.s4{grid-column:auto}.pk-pdp,.pk-spec{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.pk-hero::before{animation:none}.pk-p{transition:none}}
.pk-head .dd{position:absolute;right:0;top:calc(100% + 18px);display:none;grid-template-columns:repeat(2,minmax(150px,1fr));gap:18px 30px;padding:22px 26px;background:color-mix(in srgb,var(--c-surface) 92%,transparent);backdrop-filter:blur(18px);color:var(--c-text);border:1px solid var(--c-border);border-radius:18px;min-width:380px;z-index:50;font-family:var(--f-body)}.pk-head .more:hover .dd,.pk-head .more:focus-within .dd{display:grid}.pk-head .dd h4{font:500 11px var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--c-accent);margin:0 0 8px}.pk-head .dd a{display:block;padding:4px 0;font:500 14px var(--f-body);opacity:.85}
