<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Process</b></div><h1 style="">How a build runs</h1><p class="lead">Six phases, one named site manager, one weekly report.</p></div></section><section class="cp-sec" style="padding-top:0"><div class="cp-gt"><h2>Programme &amp; budget</h2><div class="cp-gm"><span></span><span>M1</span><span>M2</span><span>M3</span><span>M4</span><span>M5</span><span>M6</span><span>M7</span><span>M8</span><span>M9</span><span>M10</span><span>M11</span><span>M12</span></div><div class="cp-gr"><b>Design & approvals</b><div class="t"><i data-s="0" data-d="2" style="--l:0.0%;--w:16.7%"></i></div></div><div class="cp-gr"><b>Site works</b><div class="t"><i data-s="2" data-d="1.5" style="--l:16.7%;--w:12.5%"></i></div></div><div class="cp-gr"><b>Structure</b><div class="t"><i data-s="3" data-d="3" style="--l:25.0%;--w:25.0%"></i></div></div><div class="cp-gr"><b>Services & fit-out</b><div class="t"><i data-s="5.5" data-d="3.5" style="--l:45.8%;--w:29.2%"></i></div></div><div class="cp-gr"><b>Finishes</b><div class="t"><i data-s="8.5" data-d="2.5" style="--l:70.8%;--w:20.8%"></i></div></div><div class="cp-gr"><b>Handover</b><div class="t"><i data-s="11" data-d="1" style="--l:91.7%;--w:8.3%"></i></div></div><div class="cp-ct"><label>Building type<select id="cp-k"><option value="2400">Double-storey house</option><option value="1900">Shop-lot / office</option><option value="1500">Light industrial</option></select></label><label>Built-up area <span id="cp-av">250 m²</span><input id="cp-a" type="range" min="80" max="1200" step="10" value="250"></label><label>Finish<select id="cp-f"><option value="1">Standard</option><option value="1.25">Premium</option></select></label></div><div class="cp-out"><span id="cp-l">12 months · indicative build cost</span><b id="cp-c">RM 0</b></div></div></section><script>(function(){var a=document.getElementById("cp-a");if(!a)return;var bars=document.querySelectorAll(".cp-gr .t i");function u(){var m=+a.value,k=+document.getElementById("cp-k").value,f=+document.getElementById("cp-f").value,dur=Math.max(6,Math.min(12,6+Math.round(m/200))),sc=dur/12;bars.forEach(function(b){var s=+b.dataset.s*sc,d=+b.dataset.d*sc;b.style.setProperty("--l",(s/12*100)+"%");b.style.setProperty("--w",(d/12*100)+"%")});document.getElementById("cp-av").textContent=m+" m²";document.getElementById("cp-c").textContent="RM "+(Math.round(m*k*f/1000)*1000).toLocaleString("en-US");document.getElementById("cp-l").textContent=dur+" months · indicative build cost"}a.oninput=u;document.getElementById("cp-k").onchange=u;document.getElementById("cp-f").onchange=u;u()})();</script>
