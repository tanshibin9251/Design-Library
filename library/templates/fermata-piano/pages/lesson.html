<section class="fp-sec"><div class="fp-hd"><h2>Week 5 · Hands together</h2><span>Lesson 3 of 5</span></div><div class="fp-two"><div><div class="fp-score" style="color:var(--c-primary)"><svg viewBox="0 0 600 150" role="img" aria-label="Sheet music excerpt"><g stroke="currentColor" stroke-width="1.2"><path d="M20 40H580M20 52H580M20 64H580M20 76H580M20 88H580"/><path d="M20 40V88M580 40V88"/></g><text x="26" y="82" font-size="64" fill="currentColor">𝄞</text><g fill="currentColor"><ellipse cx="150" cy="76" rx="7" ry="5" transform="rotate(-20 150 76)"/><ellipse cx="220" cy="70" rx="7" ry="5" transform="rotate(-20 220 70)"/><ellipse cx="290" cy="64" rx="7" ry="5" transform="rotate(-20 290 64)"/><ellipse cx="360" cy="70" rx="7" ry="5" transform="rotate(-20 360 70)"/><ellipse cx="430" cy="76" rx="7" ry="5" transform="rotate(-20 430 76)"/><ellipse cx="500" cy="64" rx="7" ry="5" transform="rotate(-20 500 64)"/></g><g stroke="currentColor" stroke-width="1.5"><path d="M156 76V36M226 70V30M296 64V24M366 70V30M436 76V36M506 64V24"/></g></svg></div><p style="margin-top:18px;font:400 16px/1.8 var(--f-body);max-width:50ch">Play the phrase at 60 BPM, four times without a mistake. Then add 4 BPM. Record the last pass and send it to your teacher.</p></div>
<div class="fp-metro"><div class="fp-bpm"><span id="fp-bpmv">72</span> <small>BPM</small></div><div class="fp-beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div><input id="fp-bpm" type="range" min="40" max="200" value="72" aria-label="Tempo"><p style="margin-top:14px"><button id="fp-go" type="button" class="fp-btn">Start</button></p></div></div></section><script>(function(){var r=document.getElementById("fp-bpm"),out=document.getElementById("fp-bpmv"),btn=document.getElementById("fp-go"),dots=document.querySelectorAll(".fp-beats i");if(!r)return;var t=null,n=0,A=null;function click(f){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;A=A||new C();var o=A.createOscillator(),g=A.createGain();o.frequency.value=f?1200:800;g.gain.setValueAtTime(.3,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.08);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.09)}function tick(){dots.forEach(function(d,i){d.classList.toggle("on",i===n%4);d.classList.toggle("f",i===0)});click(n%4===0);n++}function start(){n=0;tick();t=setInterval(tick,60000/+r.value);btn.textContent="Stop"}function stop(){clearInterval(t);t=null;dots.forEach(function(d){d.classList.remove("on")});btn.textContent="Start"}r.oninput=function(){out.textContent=r.value;if(t){stop();start()}};btn.onclick=function(){t?stop():start()}})();</script>
