"button"));function hit(k){k.classList.add("on");setTimeout(function(){k.classList.remove("on")},180);var n=k.dataset.n;document.getElementById("fp-note").textContent=n;document.getElementById("fp-solf").textContent=n.indexOf("#")>0?"Sharp of "+n[0]+" ("+S[n[0]]+"♯)":"Solfège: "+S[n[0]];play(+k.dataset.f)}keys.forEach(function(k){k.addEventListener("pointerdown",function(e){e.preventDefault();hit(k)})});document.querySelectorAll(".fp-sc button").forEach(function(b){b.onclick=function(){var white=keys.filter(function(k){return k.classList.contains("fp-w")});var idx=[0,2,4,5,7,9,11,12];var seq=b.dataset.s.split(",").map(Number),all=keys.slice().sort(function(a,b){return +a.dataset.f-+b.dataset.f});var base=all.findIndex(function(k){return k.dataset.n==="C4"});seq.forEach(function(s,i){setTimeout(function(){var k=all[base+s];if(k)hit(k)},i*340)})}})})();</script>
