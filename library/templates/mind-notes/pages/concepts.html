<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Concept cards</b></div><h1 style="font-family:var(--f-head);font-weight:500">Concepts, in plain words</h1><p class="lead">Tap a card. Each has a small thing to try.</p></div></section><section class="mn-sec" style="padding-top:0"><div class="mn-grid"><button type="button" class="mn-flip" aria-pressed="false" aria-label="Confirmation bias. Press to flip."><span class="in"><span class="f"><span>Concept 01</span><h3>Confirmation bias</h3><p>We search for what agrees with us.</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>You notice and remember information that supports what you already believe, and quietly skip the rest.</p><p style="color:var(--c-secondary)">Try: ask what would change your mind.</p></span></span></button><button type="button" class="mn-flip" aria-pressed="false" aria-label="Sunk cost. Press to flip."><span class="in"><span class="f"><span>Concept 02</span><h3>Sunk cost</h3><p>We stay because we've already paid.</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>Time or money already spent feels like a reason to continue, even when the future looks worse.</p><p style="color:var(--c-secondary)">Try: ask whether you'd start this today.</p></span></span></button><button type="button" class="mn-flip" aria-pressed="false" aria-label="Spotlight effect. Press to flip."><span class="in"><span class="f"><span>Concept 03</span><h3>Spotlight effect</h3><p>We think everyone is watching.</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>We overestimate how much others notice our mistakes, clothes and slips of the tongue.</p><p style="color:var(--c-secondary)">Try: guess how many people noticed, then halve it.</p></span></span></button><button type="button" class="mn-flip" aria-pressed="false" aria-label="Hedonic adaptation. Press to flip."><span class="in"><span class="f"><span>Concept 04</span><h3>Hedonic adaptation</h3><p>New things stop feeling new.</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>We return to a baseline level of happiness after good and bad changes.</p><p style="color:var(--c-secondary)">Try: notice something familiar you still enjoy.</p></span></span></button><button type="button" class="mn-flip" aria-pressed="false" aria-label="Locus of control. Press to flip."><span class="in"><span class="f"><span>Concept 05</span><h3>Locus of control</h3><p>Where do you think control sits?</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>People differ in whether they feel outcomes depend on themselves or on outside forces.</p><p style="color:var(--c-secondary)">Try: list what is in your hands today.</p></span></span></button><button type="button" class="mn-flip" aria-pressed="false" aria-label="Cognitive dissonance. Press to flip."><span class="in"><span class="f"><span>Concept 06</span><h3>Cognitive dissonance</h3><p>Two beliefs, one uncomfortable feeling.</p><span class="hint">Tap to flip →</span></span><span class="b"><span>In plain words</span><p>When actions and beliefs clash, we are motivated to resolve the tension, sometimes by distorting the facts.</p><p style="color:var(--c-secondary)">Try: say the clash out loud.</p></span></span></button></div></section><script>(function(){document.querySelectorAll(".mn-flip").forEach(function(b){b.onclick=function(){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}})})();</script>
