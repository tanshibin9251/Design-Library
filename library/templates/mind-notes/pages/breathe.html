<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Breathing space</b></div><h1 style="font-family:var(--f-head);font-weight:500">A minute to breathe</h1><p class="lead">Choose a pattern, press start and follow the circle.</p></div></section><section class="mn-sec" style="padding-top:0"><div class="mn-narrow"><div class="mn-pat" role="group" aria-label="Pattern"><button type="button" aria-pressed="false" data-p="Box 4-4-4-4">Box 4-4-4-4</button><button type="button" aria-pressed="true" data-p="Calm 4-6">Calm 4-6</button><button type="button" aria-pressed="false" data-p="Sleep 4-7-8">Sleep 4-7-8</button></div><div class="mn-big" aria-live="polite"><div class="o" id="mn-o"></div><b id="mn-w">Ready<small id="mn-c">Press start</small></b></div><p style="text-align:center;margin-top:26px"><button type="button" class="mn-btn" id="mn-s">Start</button></p></div></section><script>(function(){var P={"Box 4-4-4-4": [["Breathe in", 4], ["Hold", 4], ["Breathe out", 4], ["Hold", 4]], "Calm 4-6": [["Breathe in", 4], ["Breathe out", 6]], "Sleep 4-7-8": [["Breathe in", 4], ["Hold", 7], ["Breathe out", 8]]};var s=document.getElementById("mn-s");if(!s)return;var cur="Calm 4-6",run=false,t,i=0,left=0,o=document.getElementById("mn-o"),w=document.getElementById("mn-w"),c=document.getElementById("mn-c");document.querySelectorAll(".mn-pat button").forEach(function(b){b.onclick=function(){document.querySelectorAll(".mn-pat button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});cur=b.dataset.p;if(run)stop()}});function show(){var st=P[cur][i];w.firstChild.textContent=st[0];c.textContent=left+" s";o.style.setProperty("--t",st[1]+"s");o.classList.toggle("in",/in/i.test(st[0])||(i>0&&/hold/i.test(st[0])&&/in/i.test(P[cur][i-1][0])))}function tick(){left--;if(left<=0){i=(i+1)%P[cur].length;left=P[cur][i][1]}show()}function start(){run=true;i=0;left=P[cur][0][1];s.textContent="Stop";show();t=setInterval(tick,1000)}function stop(){run=false;clearInterval(t);o.classList.remove("in");w.firstChild.textContent="Ready";c.textContent="Press start";s.textContent="Start"}s.onclick=function(){run?stop():start()}})();</script>
