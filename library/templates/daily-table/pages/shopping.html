.join(""):"<li><span>Pick a dinner to start your list.</span></li>"}if(sels.length){sels.forEach(function(s,d){s.innerHTML="<option value=-1>— no plan —</option>"+R.map(function(r,i){return"<option value="+i+">"+r.n+"</option>"}).join("");s.value=plan[d];s.onchange=function(){plan[d]=+s.value;save(plan);draw()}})}draw()})();</script>
