<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>FAQ</b></div><h1 style="font-family:var(--f-head);font-weight:600">FAQ</h1></div></section><section class="wn-sec"><div class="faq"><details open><summary>Can I use instant dashi?</summary><p>Yes. Use half the amount first and taste.</p></details><details><summary>Where can I buy mirin?</summary><p>Most supermarkets. Look for hon-mirin, not "seasoning".</p></details><details><summary>Is sake necessary?</summary><p>It softens the smell of chicken. Water with a squeeze of lemon is a stand-in.</p></details></div></section>
