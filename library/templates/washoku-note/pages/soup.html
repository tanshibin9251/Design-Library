<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Miso soup builder</b></div><h1 style="font-family:var(--f-head);font-weight:600">味噌汁ビルダー</h1><p class="lead">Pick dashi, miso and ingredients. We'll give you the order.</p></div></section><section class="wn-sec"><div class="wn-build"><div><div class="wn-step"><h3><i>1</i>Dashi</h3><div class="wn-opts" data-g="base"><button type="button" aria-pressed="false">Kombu dashi</button><button type="button" aria-pressed="true">Katsuobushi dashi</button><button type="button" aria-pressed="false">Niboshi dashi</button></div></div><div class="wn-step"><h3><i>2</i>Miso</h3><div class="wn-opts" data-g="miso"><button type="button" aria-pressed="false">White (shiro)</button><button type="button" aria-pressed="false">Red (aka)</button><button type="button" aria-pressed="true">Mixed (awase)</button></div></div><div class="wn-step"><h3><i>3</i>Two or three ingredients</h3><div class="wn-opts" data-g="veg" data-multi="1"><button type="button" aria-pressed="true">Tofu</button><button type="button" aria-pressed="true">Wakame</button><button type="button" aria-pressed="false">Daikon</button><button type="button" aria-pressed="false">Potato</button><button type="button" aria-pressed="false">Spring onion</button><button type="button" aria-pressed="false">Mushroom</button><button type="button" aria-pressed="false">Aburaage</button><button type="button" aria-pressed="false">Clams</button></div></div></div><aside class="wn-note r wn-bowl"><h3>Your bowl</h3><ul id="wn-list"></ul><div class="t" id="wn-t"></div><p id="wn-p"></p></aside></div></section><script>(function(){var g=document.querySelectorAll(".wn-opts");if(!g.length||!document.getElementById("wn-list"))return;var T={"Tofu":2,"Wakame":2,"Daikon":6,"Potato":8,"Spring onion":1,"Mushroom":4,"Aburaage":2,"Clams":5};function sel(grp){return[].slice.call(document.querySelector('[data-g="'+grp+'"]').querySelectorAll("button")).filter(function(b){return b.getAttribute("aria-pressed")==="true"}).map(function(b){return b.textContent})}function r(){var b=sel("base")[0]||"Kombu dashi",m=sel("miso")[0]||"Mixed (awase)",v=sel("veg"),t=5+v.reduce(function(a,x){return Math.max(a,T[x]||0)},0);document.getElementById("wn-list").innerHTML="<li><span>Dashi</span><b>"+b+" · 400 ml</b></li><li><span>Miso</span><b>"+m+" · 1½ tbsp</b></li>"+v.map(function(x){return"<li><span>"+x+"</span><b>"+(T[x]>4?"simmer first":"add last")+"</b></li>"}).join("");document.getElementById("wn-t").textContent="ABOUT "+t+" MIN";document.getElementById("wn-p").textContent=v.length>3?"That is a lot. Try keeping it to three so each one tastes like itself.":"Heat the dashi, simmer hard vegetables, then lower the heat and dissolve the miso through a sieve. Do not let it boil after the miso goes in."}g.forEach(function(el){el.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(el.dataset.multi){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}else{el.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}r()}})});r()})();</script>
