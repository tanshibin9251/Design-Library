<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Practice test</b></div><h1 style="font-family:var(--f-head);font-weight:800;letter-spacing:-.03em">Free practice test</h1><p class="lead">Five questions, five minutes. Explanations after every answer.</p></div></section><section class="pl-sec" style="padding-top:0"><div class="pl-quiz" id="pl-quiz"></div></section><script>(function(){var Q=[{"q": "Which document formally authorises a project and gives the project manager authority?", "o": ["Project charter", "Project management plan", "Scope statement", "Work breakdown structure"], "a": 0, "w": "The charter is issued by the sponsor and names the project manager."}, {"q": "A critical-path task slips by three days. What happens to the project end date?", "o": ["It slips by three days", "Nothing changes", "It slips only if float is exhausted", "It moves earlier"], "a": 0, "w": "Delay on the critical path has zero float, so the end date moves."}, {"q": "Which tool shows the effect of changing one variable across many outcomes?", "o": ["Pareto chart", "Sensitivity analysis", "Fishbone diagram", "Control chart"], "a": 1, "w": "Sensitivity (tornado) analysis ranks variables by impact."}, {"q": "Stakeholders disagree about scope after approval. First step?", "o": ["Update the baseline", "Follow the change control process", "Ask the sponsor to decide", "Ignore until closing"], "a": 1, "w": "Changes go through integrated change control."}, {"q": "Which is a risk response for a negative risk?", "o": ["Exploit", "Enhance", "Mitigate", "Share (positive)"], "a": 2, "w": "Mitigate reduces probability or impact of a threat."}],root=document.getElementById("pl-quiz");if(!root)return;var i=0,s=0,t=300,tm;function fmt(x){return Math.floor(x/60)+":"+("0"+x%60).slice(-2)}function done(){clearInterval(tm);var p=Math.round(s/Q.length*100);root.innerHTML="<div class=pl-qtop><span>Result</span><b>"+fmt(300-t)+" used</b></div><h2>"+s+" of "+Q.length+" correct · "+p+"%</h2><div class=pl-why>"+(p>=80?"You are on track. Book the full mock exam.":p>=60?"Close. Focus on risk and scope domains for two weeks.":"Start with the 12-week plan and rebuild the basics.")+"</div><p style=\"margin-top:20px\"><a href=\"#\" class=\"pl-btn\" id=pl-again>Try again</a></p>";document.getElementById("pl-again").onclick=function(e){e.preventDefault();i=0;s=0;t=300;start()}}function show(){if(i>=Q.length)return done();var q=Q[i];root.innerHTML="<div class=pl-qtop><span>Question "+(i+1)+" of "+Q.length+"</span><b id=pl-t>"+fmt(t)+"</b></div><div class=pl-qbar style=\"--p:"+(i/Q.length*100)+"%\"><i></i></div><h2>"+q.q+"</h2><div class=pl-opts>"+q.o.map(function(o,k){return"<button type=button data-k=\""+k+"\"><b>"+"ABCD"[k]+"</b>"+o+"</button>"}).join("")+"</div><div id=pl-why></div>";root.querySelectorAll(".pl-opts button").forEach(function(b){b.onclick=function(){var k=+b.dataset.k;root.querySelectorAll(".pl-opts button").forEach(function(x,j){x.disabled=true;x.className=j===q.a?"ok":"no"});if(k===q.a)s++;document.getElementById("pl-why").innerHTML="<div class=pl-why><b>"+(k===q.a?"Correct. ":"Not quite. ")+"</b>"+q.w+"</div><p style=\"margin-top:16px\"><button type=button class=pl-btn id=pl-next>"+(i+1>=Q.length?"See result":"Next question")+"</button></p>";document.getElementById("pl-next").onclick=function(){i++;show()}}})}function start(){clearInterval(tm);tm=setInterval(function(){t--;var e=document.getElementById("pl-t");if(e)e.textContent=fmt(t);if(t<=0)done()},1000);show()}start()})();</script>
