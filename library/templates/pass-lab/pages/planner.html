<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Study planner</b></div><h1 style="font-family:var(--f-head);font-weight:800;letter-spacing:-.03em">Build your study plan</h1><p class="lead">Tell us how long you have. We split the hours into learn, practise and mock.</p></div></section><section class="pl-sec" style="padding-top:0"><div class="pl-plan"><div class="pl-dash"><label>Weeks until exam<input id="pl-w" type="range" min="4" max="20" value="12"><output id="pl-wv">12 weeks</output></label><label>Hours per week<input id="pl-h" type="range" min="3" max="20" value="12"><output id="pl-hv">12 h / week</output></label></div>
<div class="pl-dash"><h3>Your plan</h3><div style="font:800 clamp(34px,5vw,56px)/1 var(--f-head);letter-spacing:-.03em;margin:8px 0 6px;color:var(--c-primary)" id="pl-tot">144 hours</div><div class="pl-ph" id="pl-ph"><div>Learn</div><div>Practise</div><div>Mock</div></div><p style="font:600 13px var(--f-body);color:var(--c-secondary)">Learn <span id="pl-pa"></span> · Practise <span id="pl-pb"></span> · Mock <span id="pl-pc"></span></p><p style="margin-top:16px;font:500 16px/1.6 var(--f-body)" id="pl-msg"></p></div></div></section><script>(function(){var w=document.getElementById("pl-w"),h=document.getElementById("pl-h");if(!w)return;function u(){var wk=+w.value,hr=+h.value,tot=wk*hr;document.getElementById("pl-wv").textContent=wk+" weeks";document.getElementById("pl-hv").textContent=hr+" h / week";document.getElementById("pl-tot").textContent=tot+" hours";var a=Math.round(tot*.5),b=Math.round(tot*.3),c=tot-a-b;document.getElementById("pl-ph").style.cssText="--a:"+a+"fr;--b:"+b+"fr;--c:"+c+"fr";document.getElementById("pl-pa").textContent=a+" h";document.getElementById("pl-pb").textContent=b+" h";document.getElementById("pl-pc").textContent=c+" h";document.getElementById("pl-msg").textContent=hr*wk<150?"Tight. Most candidates need 150–200 hours for PMP.":hr*wk>260?"Plenty of time. Consider a second pass on weak domains.":"A realistic plan. Keep one mock exam per fortnight."}w.oninput=u;h.oninput=u;u()})();</script>
