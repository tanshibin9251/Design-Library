<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Checklists</b></div><h1 style="font-weight:700;letter-spacing:-.03em">Checklists</h1><p class="lead">Tick as you go. Progress stays in this browser.</p></div></section><section class="kn-sec" style="padding-top:0"><h2 style="font:700 24px var(--f-head);margin-bottom:6px">Moving-out checklist</h2><p id="kn-cnt" style="font:700 14px var(--f-body);color:var(--c-secondary);margin-bottom:10px"></p><div class="kn-bar" id="kn-bar"><i></i></div><div class="kn-ck"><label><input type="checkbox"><span>Give notice to landlord (30 days)</span></label><label><input type="checkbox"><span>Book movers or van</span></label><label><input type="checkbox"><span>Transfer electricity, water and internet</span></label><label><input type="checkbox"><span>Update your address with bank and employer</span></label><label><input type="checkbox"><span>Photograph the empty rooms</span></label><label><input type="checkbox"><span>Return keys and get the deposit receipt</span></label></div></section><script>(function(){var c=document.querySelectorAll('.kn-ck input'),b=document.getElementById('kn-bar'),K='kn-ck';if(!c.length)return;var s=[];try{s=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}c.forEach(function(i,k){i.checked=s.indexOf(k)>=0;i.onchange=u});function u(){var a=[];c.forEach(function(i,k){if(i.checked)a.push(k)});try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}b.style.setProperty('--p',Math.round(a.length/c.length*100)+'%');document.getElementById('kn-cnt').textContent=a.length+' of '+c.length+' done'}u()})();</script>
