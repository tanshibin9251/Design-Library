<section class="pagehead"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Order ahead</b></div><h1>Your morning, ready to go.</h1></div></section><section class="cb-sec"><div class="in cb-order-layout"><div><figure class="cb-photo cb-wide-photo"><span class="cb-photo-fallback" aria-hidden="true">Fresh croissants arranged at a bakery counter · photo unavailable</span><img src="https://images.unsplash.com/photo-1548538931-b47653628cdc?auto=format&amp;fit=crop&amp;w=2160&amp;h=1440&amp;q=82" width="2160" height="1440" alt="Fresh croissants arranged at a bakery counter" loading="lazy" decoding="async" onerror="this.hidden=true;this.previousElementSibling.removeAttribute('aria-hidden')"></figure><h2>A little planning.<br>A very good morning.</h2><p>Choose your favourites and a sample pick-up slot.</p><p class="cb-demo-note">Interactive demo only. No order is sent, no payment is collected and no pick-up is reserved.</p></div><form class="cb-order-demo"><label class="fld"><span>Your name</span><input name="customer" autocomplete="name" required maxlength="100"></label><label class="fld"><span>Phone</span><input name="phone" type="tel" autocomplete="tel" required maxlength="40"></label><label class="fld"><span>What would you like?</span><textarea name="items" rows="4" required maxlength="1000" placeholder="2 croissants, 1 country sourdough"></textarea></label><fieldset><legend>Sample pick-up time</legend><div class="cb-slot"><label><input type="radio" name="slot" value="7:30" checked><span>7:30</span></label><label><input type="radio" name="slot" value="8:30"><span>8:30</span></label><label><input type="radio" name="slot" value="10:00"><span>10:00</span></label><label><input type="radio" name="slot" value="12:30"><span>12:30</span></label><label><input type="radio" name="slot" value="15:00"><span>15:00</span></label></div></fieldset><button class="cb-btn" type="submit">Preview pick-up request</button><output role="status" aria-live="polite"></output></form></div></section><script>(function(){var f=document.querySelector('.cb-order-demo');if(!f)return;f.addEventListener('submit',function(e){e.preventDefault();if(!f.reportValidity())return;f.querySelector('output').textContent='Demo request prepared for '+f.elements.customer.value.trim()+' at '+f.elements.slot.value+'. Nothing has been sent or reserved.'})})();</script>
