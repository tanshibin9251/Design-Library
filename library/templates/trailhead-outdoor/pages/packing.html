<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Packing lists</b></div><h1>Packing lists</h1></div></section><section class="sec"><div class="wrap"><div class="faq"><details open><summary>Overnight hike · 2 days</summary><p>Pack 45L, tent, sleeping bag, mat, stove kit, rain shell, headlamp, first aid, 3 L water capacity.</p></details><details><summary>Day hike</summary><p>Pack 20–25L, rain shell, 2 L water, snacks, first aid, headlamp.</p></details><details><summary>Paddle trip</summary><p>Dry bags, PFD, bilge pump, whistle, spare paddle.</p></details></div></div></section>
