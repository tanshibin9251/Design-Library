<section class="pagehead alt"><div class="wrap"><div class="crumbs"><a href="{{p:home}}">Home</a><span>/</span><b>Pan converter</b></div><h1 style="font-family:var(--f-head);font-weight:800">Pan converter</h1><p class="lead">Round to square, 15 to 26 cm. Get the multiplier and a bake-time hint.</p></div></section><section class="sc-sec" style="padding-top:0"><div class="sc-conv"><div class="sc-box"><h3>Recipe calls for…</h3><div class="sc-row"><label>Shape<select id="sc-s1"><option value="r">Round</option><option value="q">Square</option></select></label><label>Size (cm)<select id="sc-z1"><option>15</option><option selected>18</option><option>20</option><option>23</option><option>26</option></select></label></div><h3 style="margin-top:20px">I have…</h3><div class="sc-row"><label>Shape<select id="sc-s2"><option value="r">Round</option><option value="q" selected>Square</option></select></label><label>Size (cm)<select id="sc-z2"><option>15</option><option>18</option><option>20</option><option selected>23</option><option>26</option></select></label></div></div><div class="sc-res" aria-live="polite"><div class="x" id="sc-x">×1.0</div><p id="sc-m">Same area. No changes needed.</p><span class="t" id="sc-b"></span></div></div></section><script>(function(){var a=document.getElementById("sc-s1");if(!a)return;var ids=["sc-s1","sc-z1","sc-s2","sc-z2"].map(function(i){return document.getElementById(i)});function area(s,z){return s==="r"?Math.PI*Math.pow(z/2,2):z*z}function u(){var A=area(ids[0].value,+ids[1].value),B=area(ids[2].value,+ids[3].value),k=B/A,x=document.getElementById("sc-x");x.textContent="×"+(Math.round(k*100)/100).toFixed(2);var m=document.getElementById("sc-m"),b=document.getElementById("sc-b");if(Math.abs(k-1)<.06){m.textContent="Nearly the same area. No changes needed.";b.textContent="Bake time: as written"}else if(k>1){m.textContent="Your pan is bigger. Multiply every ingredient by "+x.textContent.slice(1)+". The batter will be shallower.";b.textContent="Bake ~"+Math.round((1-Math.min(.3,(k-1)*.2))*100)+"% of the time; start checking early"}else{m.textContent="Your pan is smaller. Multiply every ingredient by "+x.textContent.slice(1)+". The batter will be deeper.";b.textContent="Bake ~"+Math.round((1+Math.min(.35,(1-k)*.35))*100)+"% of the time; lower the oven by 10°C"}}ids.forEach(function(e){e.addEventListener("change",u)});u()})();</script>
