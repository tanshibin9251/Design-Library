<style>
/* Sparkle Nest — tokens only */
.cs-head{background:var(--c-surface);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--c-border)}

.cs-sc h3{font:700 20px var(--f-head)}.cs-sc .p{font:700 15px var(--f-body);color:var(--c-primary);margin-top:8px}
