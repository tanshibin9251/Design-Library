<style>
/* Baoshan Herbal — tokens only */
.hb-head{background:var(--c-surface);border-bottom:1px solid var(--c-border);position:sticky;top:0;z-index:40}
.hb-head .in{max-width:var(--w);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px}

.hb-logo i{width:44px;height:44px;border:2px solid var(--c-primary);border-radius:6px;display:grid;place-items:center;font:700 24px var(--f-head);font-style:normal;color:var(--c-primary)}
.hb-logo b{font:700 20px var(--f-head);display:block;line-height:1.1}.hb-logo small{font:600 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--c-secondary)}

.hb-dr::after{content:"";position:absolute;width:30%;height:3px;border-radius:3px;background:color-mix(in srgb,var(--c-secondary) 70%,#000);bottom:12%}
.hb-dr:hover{translate:0 -4px;background:var(--c-accent);color:var(--c-surface)}
.hb-sec{padding:var(--pad) 20px}.hb-sec>.in{max-width:var(--w);margin:auto}
.hb-ttl{margin-bottom:30px}.hb-ttl small{font:700 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--c-accent)}.hb-ttl h2{margin-top:6px}
.hb-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--c-border)}
.hb-flow>div{padding:22px;border-right:1px solid var(--c-border)}.hb-flow>div:last-child{border:0}
.hb-flow b{font:700 36px var(--f-head);color:var(--c-accent)}.hb-flow h3{font:700 18px var(--f-head);margin:4px 0}
.hb-cond{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hb-cd{border:1px solid var(--c-border);border-radius:8px;padding:16px;background:var(--c-surface);text-decoration:none}
.hb-cd b{font:700 30px var(--f-head);color:var(--c-primary);display:block}.hb-cd span{font:600 15px var(--f-body)}
.hb-pr{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.hb-pr .ph{aspect-ratio:4/5;border-radius:8px}.hb-pr h3{font:700 19px var(--f-head);margin-top:10px}.hb-pr small{opacity:.7;display:block}
.hb-foot{background:var(--c-primary);color:var(--on-primary)}
@media(max-width:820px){.hb-head ul{display:none}.hb-hero{grid-template-columns:1fr}.hb-flow,.hb-cond,.hb-pr{grid-template-columns:repeat(2,minmax(0,1fr))}.hb-flow>div{border-bottom:1px solid var(--c-border)}}
@media(prefers-reduced-motion:reduce){.hb-dr{transition:none}}
