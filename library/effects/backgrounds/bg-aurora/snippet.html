<!-- Aurora — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-aur{position:relative;overflow:hidden;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2em;background:var(--surface)}
.fx-aur .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:fxaur calc(20s/var(--speed)) ease-in-out infinite alternate}
.fx-aur .b1{width:46vmax;height:46vmax;left:-10%;top:-22%;background:var(--primary)}
.fx-aur .b2{width:40vmax;height:40vmax;right:-8%;top:8%;background:var(--accent);animation-delay:-7s}
.fx-aur .b3{width:34vmax;height:34vmax;left:28%;bottom:-32%;background:color-mix(in srgb,var(--primary) 50%,var(--accent));animation-delay:-12s}
.fx-aur .in{position:relative;display:grid;gap:1.1em;justify-items:center;max-width:760px}
.fx-aur h1{font-size:clamp(2.6em,7vw,5em)}.fx-aur p{opacity:.78;font-size:1.15em;max-width:46ch}
.fx-aur .btn{margin-top:.4em;padding:.95em 1.8em;border-radius:var(--radius);background:var(--text);color:var(--surface);font-weight:700;text-decoration:none}
@keyframes fxaur{to{transform:translate(9vmax,7vmax) scale(1.18)}}
@media(prefers-reduced-motion:reduce){.fx-aur .blob{animation:none}}
</style>

<section class="fx fx-aur"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="in"><h1>Soft light for a quiet hero</h1><p>A drifting aurora gives the page a pulse without shouting for attention.</p><a class="btn" href="#">Explore the work</a></div></section>
