<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-pc{width:min(960px,100%);display:grid;gap:1.6em}
.fx-pc h2{font-size:clamp(1.8em,4vw,2.6em)}
.fx-pc .wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 94%,var(--text))}
.fx-pc table{border-collapse:separate;border-spacing:0;width:100%;min-width:36em;text-align:center}
.fx-pc th,.fx-pc td{padding:.85em 1em;border-bottom:1px solid var(--border);font-size:.94em}
.fx-pc tbody tr:last-child>*{border-bottom:0}
.fx-pc tbody th[scope=row]{text-align:left;font-weight:500;position:sticky;left:0;background:color-mix(in srgb,var(--surface) 94%,var(--text));z-index:1}
.fx-pc thead th{padding:1.4em 1em 1.1em;vertical-align:bottom;font-weight:400}
.fx-pc thead th:first-child{text-align:left;position:sticky;left:0;background:color-mix(in srgb,var(--surface) 94%,var(--text));z-index:1}
.fx-pc thead b{display:block;font:600 1.15em var(--font-heading)}.fx-pc thead span{display:block;font:600 1.5em var(--font-heading);color:var(--primary);margin:.15em 0}.fx-pc thead small{opacity:.6}
.fx-pc .hl{background:color-mix(in srgb,var(--primary) 7%,transparent)}
.fx-pc thead .hl{border-top:3px solid var(--accent)}
.fx-pc .grp th{text-align:left;font-size:.74em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.6;padding:1.2em 1em .5em;background:color-mix(in srgb,var(--text) 3%,transparent)}
.fx-pc td:nth-child(3){background:color-mix(in srgb,var(--primary) 7%,transparent)}
.fx-pc .yes{color:var(--accent);font-weight:800}.fx-pc .no{opacity:.35}
.fx-pc tbody tr:not(.grp):hover>*{background-color:color-mix(in srgb,var(--text) 4%,transparent)}
.fx-pc .note{font-size:.82em;opacity:.55}
/* touch: :hover mirrored as .is-tap */
.fx-pc tbody tr:not(.grp).is-tap>*{background-color:color-mix(in srgb,var(--text) 4%,transparent)}

</style>

<div class="fx fx-pc"><h2>Compare plans</h2><div class="wrap" tabindex="0" role="region" aria-label="Plan comparison table"><table><thead><tr><th scope="col"><span class="sr" style="position:absolute;left:-9999px">Feature</span></th>
<th scope="col"><b>Starter</b><span>$12</span><small>per month</small></th><th scope="col" class="hl"><b>Studio</b><span>$29</span><small>per month</small></th><th scope="col"><b>Agency</b><span>$79</span><small>per month</small></th></tr></thead><tbody><tr class="grp"><th scope="rowgroup" colspan="4">Features</th></tr><tr><th scope="row">Websites</th><td>1</td><td>10</td><td>Unlimited</td></tr><tr><th scope="row">Storage</th><td>5 GB</td><td>100 GB</td><td>1 TB</td></tr><tr><th scope="row">Custom domain</th><td><span class="no" role="img" aria-label="Not included">–</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td></tr><tr><th scope="row">Analytics</th><td><span class="no" role="img" aria-label="Not included">–</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td></tr><tr class="grp"><th scope="rowgroup" colspan="4">Support</th></tr><tr><th scope="row">Email support</th><td><span class="yes" role="img" aria-label="Included">✓</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td></tr><tr><th scope="row">Priority response</th><td><span class="no" role="img" aria-label="Not included">–</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td></tr><tr><th scope="row">Dedicated manager</th><td><span class="no" role="img" aria-label="Not included">–</span></td><td><span class="no" role="img" aria-label="Not included">–</span></td><td><span class="yes" role="img" aria-label="Included">✓</span></td></tr></tbody></table></div>
<p class="note">All prices in USD, billed monthly. Scroll sideways on small screens.</p></div>

<script>
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
