<!-- Torn Paper Divider — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-dtorn .sec{position:relative;flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:.8em;padding:5em 1.25em}
.fx-dtorn .sec h2{font-size:clamp(1.8em,4vw,2.8em);max-width:16em}.fx-dtorn .sec p{opacity:.75;max-width:44ch}
.fx-dtorn .sec .k{font-size:.75em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.fx-dtorn{display:flex;flex-direction:column;background:var(--primary)}
.fx-dtorn .s1{background:var(--primary);color:var(--on-primary);padding-bottom:6em}
.fx-dtorn .paper{position:relative;flex:1;display:flex;margin-top:-34px;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.28))}
.fx-dtorn .sheet{position:absolute;inset:0;margin-top:-12px;background:color-mix(in srgb,var(--accent) 30%,var(--surface));clip-path:polygon(0 17.1px,0.0% 7.8px,1.8% 14.7px,3.4% 12.3px,5.7% 2.2px,8.2% 1.8px,10.6% 2.5px,12.2% 9.9px,15.4% 3.6px,17.3% 14.2px,20.7% 13.1px,23.0% 21.5px,24.6% 19.0px,26.7% 4.0px,28.4% 7.5px,31.6% 4.8px,34.2% 14.4px,36.5% 12.5px,38.1% 2.3px,40.0% 15.3px,42.4% 7.6px,45.0% 10.5px,47.1% 17.7px,50.0% 6.1px,52.7% 12.0px,55.9% 16.3px,58.0% 21.6px,59.8% 9.8px,62.8% 4.2px,65.2% 1.8px,68.1% 17.1px,70.7% 19.4px,72.9% 15.6px,75.5% 13.2px,78.0% 18.6px,81.3% 11.0px,84.2% 2.3px,87.1% 14.6px,90.6% 18.3px,92.6% 9.1px,95.5% 1.5px,97.9% 4.5px,100% 2.2px,100% 100%,0 100%)}
.fx-dtorn .front{position:relative;flex:1;display:flex;background:var(--surface);padding-top:24px;clip-path:polygon(0 9.6px,0.0% 4.8px,2.9% 15.6px,5.3% 6.0px,8.4% 19.6px,10.9% 12.6px,12.9% 1.1px,15.2% 14.5px,16.8% 19.3px,18.8% 6.4px,20.3% 23.9px,23.3% 21.1px,26.1% 1.8px,28.2% 12.4px,29.9% 22.9px,32.2% 4.6px,35.3% 3.9px,38.7% 11.4px,41.3% 8.9px,43.7% 5.3px,45.3% 20.9px,47.3% 18.9px,49.2% 23.3px,52.5% 18.4px,55.5% 14.4px,58.5% 3.8px,60.9% 20.0px,62.8% 22.2px,66.1% 10.4px,68.3% 11.4px,70.6% 23.9px,72.9% 1.6px,74.6% 17.5px,78.1% 12.4px,80.5% 13.7px,83.5% 6.1px,86.3% 13.8px,89.0% 5.2px,90.8% 9.0px,94.2% 9.0px,96.9% 8.1px,98.6% 2.5px,100% 18.9px,100% 100%,0 100%)}
.fx-dtorn .front .sec{padding-top:4em}
.fx-dtorn .front::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--text) 3%,transparent) 3px 4px)}
</style>

<div class="fx fx-dtorn"><section class="sec s1"><span class="k">Chapter one</span><h2>Dark and dramatic</h2><p>The coloured section sits behind, and the paper is laid over it.</p></section><div class="paper"><div class="sheet"></div><div class="front"><section class="sec "><span class="k">Chapter two</span><h2>Torn by hand</h2><p>Two irregular sheets and a drop shadow give a tactile, editorial edge. No images required.</p></section></div></div></div>
