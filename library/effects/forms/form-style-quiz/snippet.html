<!-- Style quiz — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-qz{width:min(620px,100%);border:1px solid var(--border);border-radius:var(--radius);padding:1.6em;background:var(--surface)}
.fx-qz .pr{height:.35em;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:1.4em}
.fx-qz .pr i{display:block;height:100%;width:0;background:var(--accent);transition:width calc(.4s/var(--speed))}
.fx-qz h3{font-size:1.5em;margin-bottom:1em}
.fx-qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.fx-qz .opts button{text-align:left;padding:1.1em;border:1px solid var(--border);border-radius:var(--radius);background:none;color:var(--text);font:600 1em var(--font-body);cursor:pointer;display:grid;gap:.6em;transition:all calc(.2s/var(--speed))}
.fx-qz .opts button:hover{border-color:var(--primary);transform:translateY(-3px)}
.fx-qz .opts .fx-art{aspect-ratio:3/2;border-radius:calc(var(--radius)*.6)}
.fx-qz .res{text-align:center;padding:1em 0;animation:fx-qz-in calc(.5s/var(--speed)) both}
.fx-qz .res h3{font-size:2em;color:var(--primary);margin-bottom:.3em}
.fx-qz .res button{margin-top:1em;background:var(--primary);color:var(--on-primary);border:0;border-radius:99px;padding:.7em 1.4em;font:700 .95em var(--font-body);cursor:pointer}
@keyframes fx-qz-in{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){.fx-qz .pr i,.fx-qz .opts button{transition:none}.fx-qz .res{animation:none}}
/* touch: :hover mirrored as .is-tap */
.fx-qz .opts button.is-tap{border-color:var(--primary);transform:translateY(-3px)}

</style>

<div class="fx fx-qz"><div class="pr"><i></i></div><div class="body" aria-live="polite"></div></div>

<script>
(function(){var r=document.querySelector('.fx-qz'),b=r.querySelector('.body'),bar=r.querySelector('.pr i'),a=[],q=0;
var Q=[['Pick the room you love most',[['Bright and airy','mod'],['Cosy and dark','cla'],['Colourful and bold','fun'],['Plain and calm','mod']]],['Your ideal weekend is…',[['At a café','mod'],['Hosting dinner','cla'],['Trying something new','fun'],['Home with a book','cla']]],['Pick a material',[['Oak','cla'],['Glass and steel','mod'],['Painted plaster','fun'],['Linen','mod']]]];
var R={mod:['Modern calm','Clean lines, pale woods and quiet colour.'],cla:['Warm classic','Rich timber, tradition and soft light.'],fun:['Playful maximal','Colour, curves and a little mischief.']};
function show(){bar.style.width=(q/Q.length*100)+'%';if(q>=Q.length){var c={};a.forEach(function(x){c[x]=(c[x]||0)+1});var k=Object.keys(c).sort(function(m,n){return c[n]-c[m]})[0];
b.innerHTML='<div class="res"><p>Your style is</p><h3>'+R[k][0]+'</h3><p>'+R[k][1]+'</p><button type="button">Retake</button></div>';b.querySelector('button').onclick=function(){a=[];q=0;show()};return}
var h='<h3>'+Q[q][0]+'</h3><div class="opts">';Q[q][1].forEach(function(o,i){h+='<button type="button" data-k="'+o[1]+'"><div class="fx-art'+(i%2?' a2':'')+'"></div>'+o[0]+'</button>'});b.innerHTML=h+'</div>';
b.querySelectorAll('.opts button').forEach(function(x){x.onclick=function(){a.push(x.dataset.k);q++;show()}})}
show()})();
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
