<!-- Scroll-driven before / after — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-baw{width:min(680px,100%)}
.fx-baw .box{height:min(70vh,440px);overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.fx-baw .track{height:230%;position:relative}
.fx-baw .pin{position:sticky;top:0;height:min(70vh,440px);display:grid;place-items:center;padding:1.2em}
.fx-baw .cmp{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;--p:0%}
.fx-baw .cmp>div{position:absolute;inset:0}
.fx-baw .cmp .bf{filter:grayscale(1) contrast(.85) brightness(.9)}
.fx-baw .cmp .af{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.fx-baw .cmp .fx-art{position:absolute;inset:0;border-radius:0}
.fx-baw .cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:var(--surface);box-shadow:0 0 0 1px color-mix(in srgb,#000 20%,transparent);z-index:2}
.fx-baw .cmp .ln::after{content:"↔";position:absolute;top:50%;left:50%;translate:-50% -50%;width:2.4em;height:2.4em;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;font-weight:700;box-shadow:0 2px 10px color-mix(in srgb,#000 25%,transparent)}
.fx-baw .tag{position:absolute;bottom:.8em;padding:.25em .8em;border-radius:99px;background:var(--surface);color:var(--text);font:700 .75em var(--font-body);letter-spacing:.1em;z-index:3}
.fx-baw .tag.l{left:.8em}.fx-baw .tag.r{right:.8em}
.fx-baw .hint{position:absolute;top:.8em;left:50%;translate:-50% 0;font-size:.8em;opacity:.6;z-index:4}
</style>

<div class="fx fx-baw"><div class="box" tabindex="0" role="region" aria-label="Before and after, scroll to reveal"><div class="track"><div class="pin"><span class="hint">Scroll ↓</span><div class="cmp"><div class="bf"><div class="fx-art a3"></div></div><div class="af"><div class="fx-art a2"></div></div><span class="ln"></span><span class="tag l">BEFORE</span><span class="tag r">AFTER</span></div></div></div></div></div>

<script>
(function(){var b=document.querySelector('.fx-baw .box'),c=b.querySelector('.cmp'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function up(){var m=b.scrollHeight-b.clientHeight,p=m>0?Math.min(1,b.scrollTop/m):0;c.style.setProperty('--p',(rm?(p>.5?100:0):p*100)+'%')}
b.addEventListener('scroll',up,{passive:true});up()})();
</script>
