<!-- Trail — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-ct{position:relative;overflow:hidden;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2em;background:var(--surface)}
.fx-ct .in{display:grid;gap:1em;justify-items:center;max-width:680px;position:relative;z-index:1;pointer-events:none}
.fx-ct h1{font-size:clamp(2.4em,6.4vw,4.6em)}.fx-ct p{opacity:.68;font-size:1.1em;max-width:40ch}
.fx-ct .eye{font-size:.78em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.fx-ct .tr{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;z-index:0;background:color-mix(in srgb,var(--accent) var(--c),var(--primary));will-change:transform}
.fx-ct.vis .tr{opacity:calc(1 - var(--t)*.9)}
@media(hover:none),(pointer:coarse){.fx-ct .tr{display:none}}
</style>

<section class="fx fx-ct"><div class="in"><span class="eye">Playful</span><h1>Leave a little trace</h1><p>Wave the pointer around. The trail eases out and settles when you stop.</p></div></section>

<script>
(function(){document.querySelectorAll('.fx-ct').forEach(function(r){
if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
var N=14,ds=[],px=[],py=[],tx=0,ty=0,run=false,first=true;
for(var i=0;i<N;i++){var e=document.createElement('i');e.className='tr';var t=i/(N-1),s=1.1-t*.8;e.style.setProperty('--t',t);e.style.setProperty('--c',(t*100)+'%');e.style.width=e.style.height=s+'em';e.style.marginLeft=e.style.marginTop=(-s/2)+'em';r.appendChild(e);ds.push(e);px.push(0);py.push(0)}
function draw(){var mv=false,lx=tx,ly=ty;for(var i=0;i<N;i++){var k=.34-i*.015;px[i]+=(lx-px[i])*k;py[i]+=(ly-py[i])*k;if(Math.abs(lx-px[i])>.2||Math.abs(ly-py[i])>.2)mv=true;lx=px[i];ly=py[i];ds[i].style.transform='translate3d('+px[i]+'px,'+py[i]+'px,0)'}
if(mv)requestAnimationFrame(draw);else run=false}
r.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var b=r.getBoundingClientRect();tx=e.clientX-b.left;ty=e.clientY-b.top;
if(first){for(var i=0;i<N;i++){px[i]=tx;py[i]=ty}first=false}r.classList.add('vis');if(!run){run=true;requestAnimationFrame(draw)}});
r.addEventListener('pointerleave',function(){r.classList.remove('vis')})})})();
/* touch: tap bursts a ring of dots */
if(!matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches&&Element.prototype.animate){document.querySelectorAll('.fx-ct').forEach(function(r){
r.addEventListener('pointerdown',function(e){var b=r.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;for(var k=0;k<9;k++){var d=document.createElement('i');d.className='tr';d.style.setProperty('--t',k/8);d.style.setProperty('--c',(k/8*100)+'%');d.style.width=d.style.height='.7em';d.style.marginLeft=d.style.marginTop='-.35em';d.style.opacity=1;r.appendChild(d);var a=k/9*6.283,dx=Math.cos(a)*46,dy=Math.sin(a)*46;(function(el){el.animate([{transform:'translate3d('+x+'px,'+y+'px,0) scale(1)',opacity:1},{transform:'translate3d('+(x+dx)+'px,'+(y+dy)+'px,0) scale(.2)',opacity:0}],{duration:650,easing:'ease-out'}).onfinish=function(){el.remove()}})(d)}})})}

</script>
