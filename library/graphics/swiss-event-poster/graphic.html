<style>
.g-sw{position:relative;width:1200px;height:1697px;overflow:hidden;background:var(--c-surface);color:var(--c-text);font-family:var(--f-body);box-sizing:border-box;padding:72px}
.g-sw *{box-sizing:border-box;margin:0}
.g-sw .meta{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:0 24px;border-top:6px solid var(--c-border);padding-top:16px;font-size:22px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase}
.g-sw .meta b{display:block;font-weight:500;opacity:.55;font-size:18px;margin-bottom:6px}
.g-sw .title{position:absolute;left:72px;top:250px;font-family:var(--f-head);font-weight:800;font-size:232px;line-height:.84;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap}
.g-sw .title span{display:block}
.g-sw .title .r{color:var(--c-primary)}
.g-sw .disc{position:absolute;right:72px;top:880px;width:430px;height:430px;border-radius:50%;background:var(--c-primary);color:var(--on-primary);display:flex;flex-direction:column;justify-content:center;align-items:center}
.g-sw .disc .n{font-family:var(--f-head);font-weight:800;font-size:260px;line-height:.85;letter-spacing:-.06em}
.g-sw .disc .m{font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin-top:10px}
.g-sw .lead{position:absolute;left:72px;top:900px;width:520px;font-family:var(--f-head);font-weight:600;font-size:46px;line-height:1.12;letter-spacing:-.02em}
.g-sw .miss{position:absolute;left:72px;top:1180px;width:520px;height:190px;border:3px dashed var(--c-border);display:flex;align-items:center;justify-content:center;font-size:24px;text-transform:uppercase;letter-spacing:.1em;opacity:.6}
.g-sw .sched{position:absolute;left:72px;right:72px;bottom:72px;border-top:6px solid var(--c-border)}
.g-sw .row{display:grid;grid-template-columns:200px 1fr 220px;gap:24px;align-items:baseline;padding:16px 0;border-bottom:2px solid var(--c-border);font-size:26px}
.g-sw .row .t{font-weight:600}
.g-sw .row .w{font-family:var(--f-head);font-weight:700;font-size:32px;letter-spacing:-.01em;text-transform:uppercase}
.g-sw .row .p{text-align:right;opacity:.65;text-transform:uppercase;font-size:22px}
</style>
<div class="g-sw">
  <div class="meta">
    <div><b>Date</b>12 — 14 Nov</div>

    <div><b>Entry</b>Free / RSVP</div>
  </div>
  <h1 class="title"><span>Open</span><span class="r">Studio</span><span>Night</span></h1>
  <p class="lead">Thirty makers, one building, three evenings. Walk in, ask anything.</p>

  <div class="disc"><div class="n">12</div><div class="m">November</div></div>
  <div class="sched">
    <div class="row"><span class="t">18:00</span><span class="w">Doors &amp; first look</span><span class="p">Floor 1</span></div>
    <div class="row"><span class="t">19:30</span><span class="w">Maker talks</span><span class="p">Hall A</span></div>
    <div class="row"><span class="t">21:00</span><span class="w">Late studio session</span><span class="p">Floor 3</span></div>
  </div>
</div>
