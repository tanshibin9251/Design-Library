<style>
.g-nb{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--c-primary);color:var(--c-text);font-family:var(--f-body);box-sizing:border-box}
.g-nb *{box-sizing:border-box;margin:0}
.g-nb .dots{position:absolute;inset:0;background-image:radial-gradient(var(--c-border) 2.5px,transparent 3px);background-size:34px 34px;opacity:.14}
.g-nb .card{position:absolute;left:56px;top:70px;width:760px;background:var(--c-surface);border:8px solid var(--c-border);box-shadow:16px 16px 0 var(--c-border);padding:34px 40px 40px;transform:rotate(-2deg)}
.g-nb .kick{display:inline-block;background:var(--c-secondary);color:var(--on-secondary);border:5px solid var(--c-border);padding:6px 20px;font:800 34px/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;transform:rotate(1.5deg)}
.g-nb h1{font:800 150px/.9 var(--f-head);letter-spacing:-.04em;text-transform:uppercase;margin-top:22px}
.g-nb h1 em{font-style:normal;background:var(--c-accent);color:var(--on-accent);padding:0 18px;display:inline-block;border:6px solid var(--c-border);transform:rotate(-2deg);margin-top:8px}
.g-nb .face{position:absolute;right:30px;bottom:0;width:430px;height:620px;border:8px solid var(--c-border);border-bottom:0;background:var(--c-secondary);box-shadow:-14px 0 0 var(--c-border);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--on-secondary);font:700 30px/1.3 var(--f-body);padding:30px}
.g-nb .sticker{position:absolute;right:70px;top:46px;width:190px;height:190px;border-radius:50%;background:var(--c-accent);color:var(--on-accent);border:8px solid var(--c-border);box-shadow:8px 8px 0 var(--c-border);display:flex;align-items:center;justify-content:center;text-align:center;font:800 44px/1 var(--f-head);text-transform:uppercase;transform:rotate(12deg)}
.g-nb .arrow{position:absolute;left:672px;top:560px;font:800 120px/1 var(--f-head);transform:rotate(18deg)}
.g-nb .time{position:absolute;left:62px;bottom:46px;background:var(--c-border);color:var(--c-surface);padding:10px 24px;font:700 38px/1 var(--f-head);letter-spacing:.02em}
</style>
<div class="g-nb">
  <div class="dots"></div>
  <div class="card">
    <span class="kick">Beginner · 新手</span>
    <h1>Learn<br>Git in<br><em>10 min</em></h1>
  </div>
  <div class="face">缺图 · 人像抠图<br>透明 PNG · 朝左</div>
  <div class="sticker">New!</div>
  <div class="arrow">↗</div>
  <div class="time">10:24</div>
</div>
