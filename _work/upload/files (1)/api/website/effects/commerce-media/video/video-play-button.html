<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-ply .vid{position:relative;overflow:hidden;background:linear-gradient(115deg,color-mix(in srgb,var(--primary) 60%,#000),color-mix(in srgb,var(--primary) 78%,#000),color-mix(in srgb,var(--accent) 45%,color-mix(in srgb,var(--primary) 60%,#000)),color-mix(in srgb,var(--accent) 80%,#000),color-mix(in srgb,var(--primary) 60%,#000));background-size:300% 300%;animation:fxvidbg-ply calc(14s/var(--speed)) ease-in-out infinite}
.fx-ply .vid::before{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;right:-10%;top:-30%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);animation:fxvidfloat-ply calc(9s/var(--speed)) ease-in-out infinite alternate}
.fx-ply .vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35));pointer-events:none}
@keyframes fxvidbg-ply{50%{background-position:100% 100%}}
@keyframes fxvidfloat-ply{to{transform:translate(-40%,30%) scale(1.2)}}
@media(prefers-reduced-motion:reduce){.fx-ply .vid,.fx-ply .vid::before{animation:none}}
.fx-ply{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:1.2em}
.fx-ply .vid{aspect-ratio:16/10;border-radius:var(--radius);display:grid;place-items:center;isolation:isolate}
.fx-ply .vid>*{position:relative;z-index:2}
.fx-ply .cap{position:absolute!important;left:1em;bottom:.8em;z-index:2;color:#fff;font:600 .85em var(--font-body);opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.fx-ply a{text-decoration:none;color:inherit}
.fx-ply a:focus-visible{outline:2px solid #fff;outline-offset:4px}
.fx-ply svg{width:100%;height:100%}
.fx-ply .p1{position:relative;width:4.6em;height:4.6em;border-radius:50%;background:#fff;color:color-mix(in srgb,var(--primary) 65%,#000);display:grid;place-items:center;transition:transform calc(.3s/var(--speed)) cubic-bezier(.3,1.5,.5,1)}
.fx-ply .p1 svg{width:1.7em;height:1.7em;margin-left:.2em}
.fx-ply .p1::before,.fx-ply .p1::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:fxplyring calc(2.4s/var(--speed)) ease-out infinite}
.fx-ply .p1::after{animation-delay:calc(1.2s/var(--speed))}
.fx-ply .p1:hover{transform:scale(1.1)}
.fx-ply .p2{display:inline-flex;align-items:center;gap:.7em;padding:.5em 1.3em .5em .5em;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:700 .92em var(--font-body);transition:background calc(.3s/var(--speed)),transform calc(.3s/var(--speed))}
.fx-ply .p2 b{width:2.7em;height:2.7em;border-radius:50%;background:#fff;color:color-mix(in srgb,var(--primary) 65%,#000);display:grid;place-items:center}.fx-ply .p2 svg{width:1.1em;height:1.1em;margin-left:.1em}
.fx-ply .p2:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.fx-ply .p3{position:relative;width:4.8em;height:4.8em;border-radius:50%;display:grid;place-items:center;color:#fff}
.fx-ply .p3 .rg{position:absolute;inset:0}.fx-ply .p3 circle{fill:none;stroke-width:2.5}
.fx-ply .p3 .bg{stroke:rgba(255,255,255,.5)}.fx-ply .p3 .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset calc(.9s/var(--speed)) cubic-bezier(.3,.7,.3,1)}
.fx-ply .p3:hover .fg,.fx-ply .p3:focus-visible .fg{stroke-dashoffset:0}
.fx-ply .p3 .pl{width:1.7em;height:1.7em;margin-left:.2em;transition:transform calc(.3s/var(--speed))}.fx-ply .p3:hover .pl{transform:scale(1.2)}
.fx-ply .p4{display:inline-flex;align-items:stretch;font:700 .85em var(--font-body);letter-spacing:.12em;text-transform:uppercase;overflow:hidden;border-radius:6px;background:var(--surface);color:var(--text)}
.fx-ply .p4 b{display:grid;place-items:center;width:3.2em;background:var(--accent);color:var(--on-accent);transition:width calc(.35s/var(--speed)) cubic-bezier(.2,.8,.2,1)}.fx-ply .p4 b svg{width:1.3em;height:1.3em}
.fx-ply .p4 span{padding:1em 1.2em}.fx-ply .p4:hover b{width:4em}
@media(max-width:560px){.fx-ply{grid-template-columns:1fr}}
@keyframes fxplyring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.fx-ply .p1::before,.fx-ply .p1::after{animation:none;display:none}.fx-ply .p1,.fx-ply .p2,.fx-ply .p3 .fg,.fx-ply .p3 .pl,.fx-ply .p4 b{transition:none}}

/* touch: :hover mirrored as .is-tap */
.fx-ply .p1.is-tap{transform:scale(1.1)}
.fx-ply .p2.is-tap{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.fx-ply .p3.is-tap .fg{stroke-dashoffset:0}
.fx-ply .p3.is-tap .pl{transform:scale(1.2)}
.fx-ply .p4.is-tap b{width:4em}

</style>

<div class="vid"><a class="p2" href="#"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg></b>Watch the film · 2:14</a><span class="cap">Glass</span></div>

<div class="vid"><a class="p4" href="#"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg></b><span>Play reel</span></a><span class="cap">Label</span></div></div>

<script>
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
