<!-- Colour swatch swap — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-csw{width:min(760px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:2em;align-items:center}
.fx-csw .stage{position:relative;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:color-mix(in srgb,var(--surface) 92%,var(--text))}
.fx-csw .layer{position:absolute;inset:0;opacity:0;transition:opacity calc(.45s/var(--speed));display:grid;place-items:center}
.fx-csw .layer.on{opacity:1}
.fx-csw .shape{width:56%;aspect-ratio:1;border-radius:46% 46% 18% 18%;background:var(--c);box-shadow:inset -14px -18px 0 color-mix(in srgb,#000 12%,transparent)}
.fx-csw h3{font-size:1.7em}.fx-csw .nm{margin:.3em 0 1em;opacity:.7}
.fx-csw .sw{display:flex;gap:.7em;margin-bottom:1em}
.fx-csw .sw button{width:2.6em;height:2.6em;border-radius:50%;border:1px solid var(--border);background:var(--c);cursor:pointer;padding:0;outline-offset:3px;transition:transform calc(.2s/var(--speed))}
.fx-csw .sw button:hover{transform:scale(1.12)}
.fx-csw .sw button[aria-checked=true]{outline:2px solid var(--primary)}
.fx-csw .stock{font-size:.9em;color:var(--accent);font-weight:700;min-height:1.4em}
@media(max-width:640px){.fx-csw{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.fx-csw .layer,.fx-csw .sw button{transition:none}}
/* touch: :hover mirrored as .is-tap */
.fx-csw .sw button.is-tap{transform:scale(1.12)}

</style>

<div class="fx fx-csw"><div class="stage" aria-hidden="true"><div class="layer on" style="--c:color-mix(in srgb,var(--primary) 70%,#fff)"><i class="shape"></i></div><div class="layer" style="--c:color-mix(in srgb,var(--accent) 80%,#fff)"><i class="shape"></i></div><div class="layer" style="--c:color-mix(in srgb,var(--secondary) 60%,#fff)"><i class="shape"></i></div><div class="layer" style="--c:color-mix(in srgb,var(--text) 88%,#fff)"><i class="shape"></i></div></div>
<div><h3>Pebble Armchair</h3><p class="nm">Colour: <b id="fx-csw-n">Ocean</b></p><div class="sw" role="radiogroup" aria-label="Colour"><button type="button" role="radio" aria-checked="true" aria-label="Ocean" data-n="Ocean" data-s="In stock" style="--c:color-mix(in srgb,var(--primary) 70%,#fff)"></button><button type="button" role="radio" aria-checked="false" aria-label="Sunset" data-n="Sunset" data-s="Only 3 left" style="--c:color-mix(in srgb,var(--accent) 80%,#fff)"></button><button type="button" role="radio" aria-checked="false" aria-label="Moss" data-n="Moss" data-s="Ships in 2 weeks" style="--c:color-mix(in srgb,var(--secondary) 60%,#fff)"></button><button type="button" role="radio" aria-checked="false" aria-label="Ink" data-n="Ink" data-s="In stock" style="--c:color-mix(in srgb,var(--text) 88%,#fff)"></button></div><p class="stock" id="fx-csw-s" aria-live="polite">In stock</p></div></div>

<script>
(function(){var r=document.querySelector('.fx-csw'),bs=r.querySelectorAll('.sw button'),ls=r.querySelectorAll('.layer'),n=r.querySelector('#fx-csw-n'),s=r.querySelector('#fx-csw-s');
function pick(i){bs.forEach(function(b,j){b.setAttribute('aria-checked',j===i);b.tabIndex=j===i?0:-1});ls.forEach(function(l,j){l.classList.toggle('on',j===i)});n.textContent=bs[i].dataset.n;s.textContent=bs[i].dataset.s}
bs.forEach(function(b,i){b.onclick=function(){pick(i)};b.onkeydown=function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();pick((i+1)%bs.length);bs[(i+1)%bs.length].focus()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();var k=(i+bs.length-1)%bs.length;pick(k);bs[k].focus()}}});pick(0)})();
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
