<!-- Size picker with stock — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-szp{width:min(460px,100%)}
.fx-szp .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.8em}
.fx-szp .hd a{font-size:.85em;color:var(--primary)}
.fx-szp .g{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em}
.fx-szp button.s{position:relative;padding:.85em 0;border:1px solid var(--border);border-radius:calc(var(--radius)*.6);background:var(--surface);color:var(--text);font:700 .95em var(--font-body);cursor:pointer;transition:all calc(.2s/var(--speed))}
.fx-szp button.s:hover:not(.out){border-color:var(--primary)}
.fx-szp button.s[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.fx-szp button.s.out{opacity:.45;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--text) 14%,transparent) 6px 7px)}
.fx-szp .msg{margin-top:1em;min-height:2.6em;font-size:.92em}
.fx-szp .msg b{color:var(--accent)}
.fx-szp .msg a{color:var(--primary);font-weight:700}
@media(prefers-reduced-motion:reduce){.fx-szp button.s{transition:none}}
/* touch: :hover mirrored as .is-tap */
.fx-szp button.s.is-tap:not(.out){border-color:var(--primary)}

</style>

<div class="fx fx-szp"><div class="hd"><b>Select size</b><a href="#" onclick="return false">Size guide</a></div><div class="g" role="group" aria-label="Size"><button class="s" type="button" aria-pressed="false" data-st="8">XS</button><button class="s" type="button" aria-pressed="false" data-st="2">S</button><button class="s" type="button" aria-pressed="true" data-st="14">M</button><button class="s out" type="button" aria-pressed="false" data-st="0" aria-label="L, sold out">L</button><button class="s" type="button" aria-pressed="false" data-st="1">XL</button></div><p class="msg" id="fx-szp-m" aria-live="polite"></p></div>

<script>
(function(){var r=document.querySelector('.fx-szp'),bs=r.querySelectorAll('.s'),m=r.querySelector('#fx-szp-m');
function show(b){var n=+b.dataset.st,l=b.textContent;m.innerHTML=n===0?'Size '+l+' is sold out. <a href="#" onclick="return false">Notify me when back</a>':n<=3?'<b>Only '+n+' left</b> in size '+l+' — order soon.':'Size '+l+' is in stock and ships today.'}
bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.setAttribute('aria-pressed',x===b&&!b.classList.contains('out'))});show(b)}});show(r.querySelector('[aria-pressed=true]'))})();
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
