<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
@keyframes fxhud-a{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes fxhud-b{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fx-hud{width:min(940px,100%);display:grid;gap:3em;text-align:center;justify-items:center}
.fx-hud .eye{font-size:.78em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.fx-hud h1{font-size:clamp(2.4em,6.4vw,4.8em);line-height:1.12;max-width:13em}
.fx-hud .u{position:relative;display:inline-block;white-space:nowrap}
.fx-hud .u svg{position:absolute;left:-2%;width:104%;overflow:visible;pointer-events:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.fx-hud .u path{stroke-dasharray:1;stroke-dashoffset:1;animation:fxhud-a calc(1.1s/var(--speed)) cubic-bezier(.6,.1,.2,1) .5s forwards}
.fx-hud .u:hover path{animation-name:fxhud-b}
.fx-hud .wavy{color:var(--accent)}.fx-hud .wavy svg{bottom:-.2em;height:.28em}.fx-hud .wavy path{stroke-width:5;vector-effect:non-scaling-stroke}
.fx-hud .row{display:grid;grid-template-columns:1fr 1fr;gap:2.4em;width:100%}
.fx-hud h2{font-size:clamp(1.6em,3.4vw,2.4em);line-height:1.25}
.fx-hud .line{color:var(--primary)}.fx-hud .line svg{bottom:-.1em;height:.2em}.fx-hud .line path{stroke-width:3;vector-effect:non-scaling-stroke}
.fx-hud .line svg+svg{bottom:-.3em}.fx-hud .line svg+svg path{animation-delay:.9s}
.fx-hud .ring{color:var(--accent);padding:0 .25em}.fx-hud .ring svg{top:-.2em;left:-8%;width:116%;height:1.5em}.fx-hud .ring path{stroke-width:2.5;vector-effect:non-scaling-stroke;animation-delay:1.2s}
.fx-hud small{opacity:.5;font-size:.85em}
@media(max-width:700px){.fx-hud .row{grid-template-columns:1fr;gap:2em}.fx-hud .u{white-space:normal}}
@media(prefers-reduced-motion:reduce){.fx-hud .u path{animation:none;stroke-dashoffset:0}}
/* touch: :hover mirrored as .is-tap */
.fx-hud .u.is-tap path{animation-name:fxhud-b}

</style>

<div class="fx fx-hud"><span class="eye">Our approach</span>
<h1>Design that feels <span class="u wavy">genuinely human<svg viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 7 C 25 1, 40 12, 65 6 S 105 1, 130 7 S 175 12, 200 6 S 255 1, 298 6"/></svg></span></h1>
<div class="row"><h2>Craft you can <span class="u line">feel<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 6 C 30 2, 70 8, 98 4"/></svg><svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M10 5 C 40 2, 70 7, 92 3"/></svg></span> in every detail</h2>
<h2>Work that gets <span class="u ring">noticed<svg viewBox="0 0 120 50" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M60 4 C 25 3, 4 14, 6 26 C 8 40, 40 47, 68 46 C 100 45, 117 34, 112 20 C 108 8, 80 3, 40 7"/></svg></span> early</h2></div>
<small>Hover a word to redraw it</small></div>

<script>
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
