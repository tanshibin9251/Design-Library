<!-- Body-area selector — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-bdy{width:min(560px,100%);display:grid;grid-template-columns:200px 1fr;gap:2em;align-items:center}
.fx-bdy svg{width:100%;height:auto}
.fx-bdy .z{fill:color-mix(in srgb,var(--primary) 12%,var(--surface));stroke:var(--primary);stroke-width:1.5;cursor:pointer;transition:fill calc(.2s/var(--speed))}
.fx-bdy .z:hover{fill:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.fx-bdy .z:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.fx-bdy .z.on{fill:var(--accent)}
.fx-bdy h3{font-size:1.2em;margin-bottom:.6em}
.fx-bdy ul{list-style:none;padding:0;margin:0;min-height:8em;display:grid;gap:.4em;align-content:start}
.fx-bdy li{display:flex;justify-content:space-between;padding:.5em .8em;border-radius:calc(var(--radius)*.6);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:600;font-size:.92em}
.fx-bdy .empty{opacity:.55;background:none;font-weight:400}
@media(max-width:540px){.fx-bdy{grid-template-columns:1fr}.fx-bdy svg{max-width:200px;margin:auto}}
@media(prefers-reduced-motion:reduce){.fx-bdy .z{transition:none}}
/* touch: :hover mirrored as .is-tap */
.fx-bdy .z.is-tap{fill:color-mix(in srgb,var(--accent) 35%,var(--surface))}

</style>

<div class="fx fx-bdy"><svg viewBox="0 0 120 260" role="group" aria-label="Body areas"><g>
<ellipse class="z" data-n="Head &amp; neck" cx="60" cy="22" rx="16" ry="20" tabindex="0" role="button" aria-pressed="false" aria-label="Head and neck"/>
<path class="z" data-n="Shoulders" d="M26 52 Q60 40 94 52 L90 70 Q60 62 30 70Z" tabindex="0" role="button" aria-pressed="false" aria-label="Shoulders"/>
<rect class="z" data-n="Back" x="32" y="72" width="56" height="60" rx="8" tabindex="0" role="button" aria-pressed="false" aria-label="Back"/>
<rect class="z" data-n="Arms" x="10" y="56" width="16" height="84" rx="8" tabindex="0" role="button" aria-pressed="false" aria-label="Left arm"/>
<rect class="z" data-n="Arms" x="94" y="56" width="16" height="84" rx="8" tabindex="0" role="button" aria-pressed="false" aria-label="Right arm"/>
<rect class="z" data-n="Legs" x="32" y="136" width="24" height="86" rx="10" tabindex="0" role="button" aria-pressed="false" aria-label="Left leg"/>
<rect class="z" data-n="Legs" x="64" y="136" width="24" height="86" rx="10" tabindex="0" role="button" aria-pressed="false" aria-label="Right leg"/>
<ellipse class="z" data-n="Feet" cx="44" cy="240" rx="14" ry="12" tabindex="0" role="button" aria-pressed="false" aria-label="Left foot"/>
<ellipse class="z" data-n="Feet" cx="76" cy="240" rx="14" ry="12" tabindex="0" role="button" aria-pressed="false" aria-label="Right foot"/></g></svg>
<div><h3>Areas to focus on</h3><ul id="fx-bdy-l" aria-live="polite"></ul></div></div>

<script>
(function(){var r=document.querySelector('.fx-bdy'),zs=r.querySelectorAll('.z'),l=r.querySelector('#fx-bdy-l'),on={};
function draw(){var k=Object.keys(on).filter(function(x){return on[x]});l.innerHTML=k.length?k.map(function(x){return '<li>'+x+'<span>✓</span></li>'}).join(''):'<li class="empty">Tap an area on the figure</li>';
zs.forEach(function(z){var a=!!on[z.dataset.n];z.classList.toggle('on',a);z.setAttribute('aria-pressed',a)})}
function tog(z){on[z.dataset.n]=!on[z.dataset.n];draw()}
zs.forEach(function(z){z.onclick=function(){tog(z)};z.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(z)}}});draw()})();
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
