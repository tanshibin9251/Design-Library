<!-- Shop-the-scene hotspots — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-hot{width:min(760px,100%);position:relative}
.fx-hot .scene{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden}
.fx-hot .scene .fx-art{position:absolute;inset:0;border-radius:0}
.fx-hot .pin{position:absolute;translate:-50% -50%}
.fx-hot .pin>button{width:2.2em;height:2.2em;border-radius:50%;border:2px solid var(--on-accent);background:var(--accent);color:var(--on-accent);font:700 .85em var(--font-body);cursor:pointer;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);animation:fx-hot-p 2.4s infinite}
.fx-hot .pin>button[aria-expanded=true]{animation:none;background:var(--surface);color:var(--text);border-color:var(--accent)}
@keyframes fx-hot-p{70%{box-shadow:0 0 0 .9em transparent}}
.fx-hot .pop{position:absolute;left:50%;top:calc(100% + .7em);translate:-50% 0;width:13em;background:var(--surface);color:var(--text);border-radius:var(--radius);box-shadow:0 12px 30px color-mix(in srgb,#000 22%,transparent);padding:.8em;display:none;z-index:4;font-size:.9em}
.fx-hot .pin.up .pop{top:auto;bottom:calc(100% + .7em)}
.fx-hot .pin>button[aria-expanded=true]+.pop{display:block}
.fx-hot .pop b{display:block}.fx-hot .pop span{opacity:.7}.fx-hot .pop a{display:inline-block;margin-top:.5em;color:var(--primary);font-weight:700}
@media(prefers-reduced-motion:reduce){.fx-hot .pin>button{animation:none}}
</style>

<div class="fx fx-hot"><div class="scene"><div class="fx-art a2"></div>
<div class="pin" style="left:24%;top:62%"><button type="button" aria-expanded="false" aria-label="Product 1: Sofa">1</button><div class="pop" role="dialog" aria-label="Sofa"><b>Halden Sofa</b><span>RM 4,890</span><br><a href="#" onclick="return false">View product →</a></div></div>
<div class="pin up" style="left:58%;top:74%"><button type="button" aria-expanded="false" aria-label="Product 2: Coffee table">2</button><div class="pop" role="dialog" aria-label="Coffee table"><b>Brae Coffee Table</b><span>RM 1,190</span><br><a href="#" onclick="return false">View product →</a></div></div>
<div class="pin" style="left:80%;top:30%"><button type="button" aria-expanded="false" aria-label="Product 3: Floor lamp">3</button><div class="pop" role="dialog" aria-label="Floor lamp"><b>Tilde Floor Lamp</b><span>RM 690</span><br><a href="#" onclick="return false">View product →</a></div></div></div></div>

<script>
(function(){var r=document.querySelector('.fx-hot'),bs=r.querySelectorAll('.pin>button');
function closeAll(except){bs.forEach(function(b){if(b!==except)b.setAttribute('aria-expanded','false')})}
bs.forEach(function(b){b.onclick=function(e){e.stopPropagation();var o=b.getAttribute('aria-expanded')==='true';closeAll(b);b.setAttribute('aria-expanded',!o)}});
document.addEventListener('click',function(e){if(!r.contains(e.target))closeAll()});
r.addEventListener('keydown',function(e){if(e.key==='Escape'){closeAll();}})})();
</script>
