<!-- 360° product viewer — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-v360{width:min(460px,100%);text-align:center}
.fx-v360 .stage{position:relative;aspect-ratio:1;border-radius:var(--radius);background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--primary) 12%,var(--surface)),var(--surface));display:grid;place-items:center;cursor:grab;touch-action:pan-y;user-select:none;perspective:900px;border:1px solid var(--border)}
.fx-v360 .stage:active{cursor:grabbing}
.fx-v360 .stage:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.fx-v360 .obj{width:42%;aspect-ratio:1;position:relative;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(var(--a,0deg))}
.fx-v360 .obj i{position:absolute;inset:0;border:2px solid var(--on-primary);background:color-mix(in srgb,var(--primary) 82%,var(--accent));backface-visibility:hidden}.fx-v360 .obj i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s,100px)/2));background:color-mix(in srgb,var(--accent) 70%,#fff)}
.fx-v360 .obj i:nth-child(1){transform:translateZ(calc(var(--s,100px)/2))}.fx-v360 .obj i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s,100px)/2));background:color-mix(in srgb,var(--primary) 60%,var(--accent))}
.fx-v360 .obj i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s,100px)/2));background:var(--accent)}.fx-v360 .obj i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s,100px)/2));background:color-mix(in srgb,var(--secondary) 80%,var(--primary))}
.fx-v360 .shadow{position:absolute;bottom:14%;width:34%;height:6%;border-radius:50%;background:var(--text);opacity:.18;filter:blur(8px)}
.fx-v360 .bar{height:.4em;border-radius:99px;background:var(--border);margin:1em auto 0;width:70%;overflow:hidden}
.fx-v360 .bar span{display:block;height:100%;width:var(--p,0%);background:var(--primary)}
.fx-v360 p{margin-top:.7em;font-size:.88em;opacity:.65}
</style>

<div class="fx fx-v360"><div class="stage" tabindex="0" role="img" aria-label="360 degree product view. Drag or use left and right arrow keys to rotate."><div class="shadow"></div><!-- Replace .obj with <img id="frame"> and set src to frame-NN.jpg in the script --><div class="obj"><i></i><i></i><i></i><i></i><i></i></div></div><div class="bar" aria-hidden="true"><span></span></div><p>Drag or press ← → to rotate</p></div>

<script>
(function(){var r=document.querySelector('.fx-v360'),st=r.querySelector('.stage'),o=r.querySelector('.obj'),bar=r.querySelector('.bar span'),N=36,f=0,x0=null,f0=0,w=st.getBoundingClientRect().width||400;
function set(n){f=((n%N)+N)%N;o.style.setProperty('--a',(f*360/N)+'deg');bar.style.setProperty('--p',(f/N*100)+'%');bar.parentNode.style.setProperty('--p',(f/N*100)+'%');bar.style.width=(f/N*100)+'%'}
o.style.setProperty('--s',(st.getBoundingClientRect().width*.42)+'px');
st.addEventListener('pointerdown',function(e){x0=e.clientX;f0=f;st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',function(e){if(x0===null)return;set(f0+Math.round((e.clientX-x0)/(w/N)*1.6))});
['pointerup','pointercancel'].forEach(function(ev){st.addEventListener(ev,function(){x0=null})});
st.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();set(f+1)}if(e.key==='ArrowLeft'){e.preventDefault();set(f-1)}});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){var t=0,id=setInterval(function(){if(x0!==null||++t>36){clearInterval(id);return}set(f+1)},60)}set(0)})();
</script>
