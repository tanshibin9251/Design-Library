<!-- Floor-plan room picker — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-flr{width:min(680px,100%);display:grid;grid-template-columns:1.2fr 1fr;gap:1.4em}
.fx-flr .plan{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,3.6em);gap:3px;padding:3px;border:3px solid var(--text);border-radius:calc(var(--radius)*.5);background:var(--text)}
.fx-flr .plan button{border:0;background:var(--surface);color:var(--text);font:700 .85em var(--font-body);cursor:pointer;transition:background calc(.2s/var(--speed));text-align:center;padding:.3em}
.fx-flr .plan button:hover{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.fx-flr .plan button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.fx-flr .a-liv{grid-area:1/1/3/4}.fx-flr .a-kit{grid-area:1/4/3/7}.fx-flr .a-bed{grid-area:3/1/5/3}.fx-flr .a-bath{grid-area:3/3/5/4}.fx-flr .a-bed2{grid-area:3/4/5/7}
.fx-flr .info{border:1px solid var(--border);border-radius:var(--radius);padding:1.1em;background:var(--surface)}
.fx-flr .info h3{font-size:1.25em;margin-bottom:.6em}
.fx-flr .info ul{list-style:none;margin:0;padding:0;display:grid;gap:.4em}
.fx-flr .info li{display:flex;justify-content:space-between;gap:1em;font-size:.92em;border-bottom:1px dashed var(--border);padding-bottom:.4em}
.fx-flr .info li b{color:var(--primary);white-space:nowrap}
@media(max-width:600px){.fx-flr{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.fx-flr .plan button{transition:none}}
/* touch: :hover mirrored as .is-tap */
.fx-flr .plan button.is-tap{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}

</style>

<div class="fx fx-flr"><div class="plan" role="group" aria-label="Floor plan"><button class="a-liv" type="button" aria-pressed="true" data-r="Living room">Living</button><button class="a-kit" type="button" aria-pressed="false" data-r="Kitchen">Kitchen</button><button class="a-bed" type="button" aria-pressed="false" data-r="Master bedroom">Master</button><button class="a-bath" type="button" aria-pressed="false" data-r="Bathroom">Bath</button><button class="a-bed2" type="button" aria-pressed="false" data-r="Second bedroom">Bedroom 2</button></div>
<div class="info" aria-live="polite"><h3 id="fx-flr-h"></h3><ul id="fx-flr-l"></ul></div></div>

<script>
(function(){var r=document.querySelector('.fx-flr'),bs=r.querySelectorAll('.plan button'),h=r.querySelector('#fx-flr-h'),l=r.querySelector('#fx-flr-l');
var D={'Living room':[['Feature wall & paint','1,800'],['Flooring (per sq ft)','9'],['Lighting & cove','2,500']],'Kitchen':[['Cabinets (per ft)','480'],['Countertop & backsplash','3,200'],['Wet works','5,500']],'Master bedroom':[['Built-in wardrobe','4,800'],['Bed feature & headboard','2,200'],['Flooring (per sq ft)','9']],'Bathroom':[['Retile & waterproofing','6,500'],['Fixtures & fittings','2,800'],['Vanity cabinet','1,900']],'Second bedroom':[['Study desk & shelf','2,400'],['Wardrobe','3,600'],['Paint','900']]};
function pick(b){bs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});var k=b.dataset.r;h.textContent=k;l.innerHTML=D[k].map(function(x){return '<li><span>'+x[0]+'</span><b>from RM '+x[1]+'</b></li>'}).join('')}
bs.forEach(function(b){b.onclick=function(){pick(b)}});pick(bs[0])})();
/* fx-touch */
(function(){if(window.__fxTap)return;window.__fxTap=1;var cur=[];function clr(){cur.forEach(function(e){e.classList.remove('is-tap')});cur=[]}
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;clr();var n=e.target.closest&&e.target.closest('.fx');if(!n)return;for(var el=e.target;el&&el!==n.parentNode;el=el.parentNode){if(el.classList){el.classList.add('is-tap');cur.push(el)}}},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(clr,1400)},{passive:true})})();
</script>
