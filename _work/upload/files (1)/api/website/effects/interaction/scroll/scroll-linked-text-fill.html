<!-- Scroll-linked text fill — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-stf{width:min(1000px,100%)}
.fx-stf .hint{opacity:.5;font-size:.85em;text-align:center;padding:2em 0}
.fx-stf .run{height:260vh;position:relative}
.fx-stf .pin{position:sticky;top:0;height:100vh;display:grid;align-content:center;gap:1.4em}
.fx-stf .k{font-size:.78em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.fx-stf p.big{font:600 clamp(1.7em,4.6vw,3.2em)/1.18 var(--font-heading);letter-spacing:-.01em;max-width:22ch}
.fx-stf .w{opacity:.16;transition:opacity calc(.25s/var(--speed)) linear,color calc(.25s/var(--speed)) linear}
.fx-stf .w.on{opacity:1}.fx-stf .w.em.on{color:var(--accent)}
.fx-stf .meter{height:3px;background:var(--border);border-radius:3px;max-width:22ch;overflow:hidden}
.fx-stf .meter i{display:block;height:100%;background:var(--primary);transform-origin:left;transform:scaleX(var(--p,0))}
@media(prefers-reduced-motion:reduce){.fx-stf .w{opacity:1;transition:none}.fx-stf .w.em{color:var(--accent)}.fx-stf .meter{display:none}}

</style>

<div class="fx fx-stf"><p class="hint">Scroll down ↓ — the words follow your scroll</p>
<div class="run"><div class="pin"><span class="k">Our belief</span>
<p class="big" data-stf>We build quiet websites that feel <em class="em">considered</em>, load fast, and let your real work take centre stage.</p>
<div class="meter" aria-hidden="true"><i></i></div></div></div>
<p class="hint">…and back up again ↑</p></div>

<script>
(function(){var root=document.querySelector('.fx-stf'),run=root.querySelector('.run'),big=root.querySelector('[data-stf]'),mt=root.querySelector('.meter i'),tk=false;
(function split(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){if(c.nodeType===3){var f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(function(t){if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}var s=document.createElement('span');s.className='w'+(n.classList&&n.classList.contains('em')?' em':'');s.textContent=t;f.appendChild(s)});n.replaceChild(f,c)}else if(c.nodeType===1)split(c)})})(big);
var ws=big.querySelectorAll('.w');
function upd(){tk=false;var r=run.getBoundingClientRect(),h=r.height-innerHeight,p=h>0?Math.min(1,Math.max(0,-r.top/h)):1;
mt.style.setProperty('--p',p);var n=Math.round(p*1.1*ws.length);ws.forEach(function(w,i){w.classList.toggle('on',i<n)})}
function req(){if(!tk){tk=true;requestAnimationFrame(upd)}}addEventListener('scroll',req,{passive:true});addEventListener('resize',req);upd()})();
</script>
