<!-- Service-area postcode checker — paste where you want it -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:300,400,500,600,700|Mulish:300,400,500,600,700|Noto+Sans+SC:300,400,500,600,700&display=swap">
<style>
:root{
  --primary: #1f2a44;
  --secondary: #4b5675;
  --text: #1f2328;
  --accent: #e8590c;
  --surface: #faf8f5;
  --border: #e6e0d6;
  --on-primary: #ffffff;
  --on-accent: #ffffff;
  --font-heading: 'Lora', 'Noto Serif SC', serif;
  --font-body: 'Mulish', 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --scale: 1;   /* text size multiplier */
  --speed: 1;   /* animation speed multiplier */
}

.fx{font-family:var(--font-body);font-size:calc(16px*var(--scale,1));color:var(--text);line-height:1.55}
.fx,.fx *,.fx *::before,.fx *::after{box-sizing:border-box}
.fx{max-width:100%}
@media (pointer:coarse){.fx :not(.dots)>button,.fx select,.fx summary,.fx [role=button],.fx input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}.fx :not(.dots)>button{min-width:44px}.fx nav a,.fx footer a,.fx header a,.fx li>a{display:inline-flex;align-items:center;min-height:44px}.fx .dots button{min-width:28px;min-height:28px}}
.fx h1,.fx h2,.fx h3{font-family:var(--font-heading);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.12}
.fx p{margin:0}
.fx-art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 45%,var(--accent)))}
.fx-art::before,.fx-art::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.35}
.fx-art::before{width:60%;aspect-ratio:1;right:-12%;top:-20%}.fx-art::after{width:38%;aspect-ratio:1;left:8%;bottom:-18%;opacity:.25;background:#fff}
.fx-art.a2{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--primary)))}
.fx-art.a3{background:linear-gradient(200deg,color-mix(in srgb,var(--primary) 70%,#000),var(--accent))}
.fx-pc2{width:min(460px,100%);border:1px solid var(--border);border-radius:var(--radius);padding:1.4em;background:var(--surface)}
.fx-pc2 h3{font-size:1.25em;margin-bottom:.3em}.fx-pc2 .sub{opacity:.7;font-size:.92em;margin-bottom:1em}
.fx-pc2 .row{display:flex;gap:.5em}
.fx-pc2 input{flex:1;min-width:0;padding:.8em 1em;border:1px solid var(--border);border-radius:calc(var(--radius)*.6);background:var(--surface);color:var(--text);font:700 1.2em var(--font-body);letter-spacing:.3em;text-align:center}
.fx-pc2 input:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.fx-pc2 button.go{padding:0 1.4em;border:0;border-radius:calc(var(--radius)*.6);background:var(--primary);color:var(--on-primary);font:700 .95em var(--font-body);cursor:pointer}
.fx-pc2 .res{margin-top:1em;min-height:5.5em}
.fx-pc2 .box{display:flex;gap:.9em;padding:1em;border-radius:var(--radius);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));animation:fx-pc2-in calc(.3s/var(--speed)) both}
.fx-pc2 .box[data-t=ok]{--c:var(--accent)}.fx-pc2 .box[data-t=warn]{--c:var(--secondary)}.fx-pc2 .box[data-t=no]{--c:var(--primary)}
.fx-pc2 .ic{width:2.2em;height:2.2em;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center;font-weight:800;flex:none}
.fx-pc2 .box b{display:block}.fx-pc2 .box p{font-size:.9em;opacity:.8;margin-top:.15em}
.fx-pc2 .wl{display:flex;gap:.5em;margin-top:.7em}.fx-pc2 .wl input{font:500 .9em var(--font-body);letter-spacing:0;text-align:left;padding:.55em .8em}
.fx-pc2 .wl button{padding:.55em 1em;border:1px solid var(--primary);background:none;color:var(--primary);border-radius:calc(var(--radius)*.6);font:700 .85em var(--font-body);cursor:pointer}
.fx-pc2 .load{height:5em;border-radius:var(--radius);background:linear-gradient(90deg,var(--border),color-mix(in srgb,var(--border) 40%,var(--surface)),var(--border));background-size:200% 100%;animation:fx-pc2-s 1s linear infinite}
@keyframes fx-pc2-in{from{opacity:0;transform:translateY(6px)}}@keyframes fx-pc2-s{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.fx-pc2 .box,.fx-pc2 .load{animation:none}}
</style>

<form class="fx fx-pc2" novalidate><h3>Do we serve your area?</h3><p class="sub">Enter your 5-digit postcode.</p><div class="row"><label class="sr" for="fx-pc2-i" style="position:absolute;left:-9999px">Postcode</label><input id="fx-pc2-i" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="47500" aria-describedby="fx-pc2-r"><button class="go" type="submit">Check</button></div><div class="res" id="fx-pc2-r" aria-live="polite"></div></form>

<script>
(function(){
/* ── edit these: [from, to, type, title, detail] ── */
var AREAS=[[40000,48999,'ok','Yes, we come to you','Free site visit within 2 working days.'],[50000,60000,'ok','Yes, we cover Kuala Lumpur','Free site visit within 2 working days.'],[43000,43999,'ok','Yes, we come to you','Free site visit within 2 working days.'],[70000,79999,'warn','We cover you, with a surcharge','Travel fee of RM 80 applies to site visits.'],[80000,81999,'warn','We cover Johor Bahru, with a surcharge','Travel fee of RM 120 applies to site visits.']];
/* ───────────────────────────────────────────── */
var f=document.querySelector('.fx-pc2'),i=f.querySelector('input'),o=f.querySelector('.res'),tm;
i.addEventListener('input',function(){i.value=i.value.replace(/\D/g,'').slice(0,5)});
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
f.addEventListener('submit',function(e){e.preventDefault();var v=i.value;
 if(v.length!==5){o.innerHTML='<div class="box" data-t="no"><span class="ic">!</span><div><b>Enter 5 digits</b><p>For example 47500.</p></div></div>';return}
 o.innerHTML='<div class="load" aria-hidden="true"></div>';clearTimeout(tm);
 tm=setTimeout(function(){var n=+v,m=null;AREAS.forEach(function(a){if(n>=a[0]&&n<=a[1]&&!m)m=a});
  if(m){o.innerHTML='<div class="box" data-t="'+m[2]+'"><span class="ic">'+(m[2]==='ok'?'✓':'+')+'</span><div><b>'+esc(m[3])+'</b><p>'+esc(m[4])+'</p></div></div>'}
  else{o.innerHTML='<div class="box" data-t="no"><span class="ic">✕</span><div><b>Not in our area yet</b><p>Leave your email and we will tell you when we arrive.</p><div class="wl"><input type="email" placeholder="you@email.com" aria-label="Email for waitlist"><button type="button">Notify me</button></div></div></div>';
   o.querySelector('.wl button').onclick=function(){var em=o.querySelector('.wl input');if(/^\S+@\S+\.\S+$/.test(em.value)){o.innerHTML='<div class="box" data-t="ok"><span class="ic">✓</span><div><b>You are on the list</b><p>We will email you first.</p></div></div>'}else em.focus()}}},450)})})();
</script>
